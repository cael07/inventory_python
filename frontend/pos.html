<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/vue@3"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    video { width: 100%; max-width: 400px; border:2px solid #333; }
    table { width:100%; border-collapse: collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:6px; }
    button { padding:14px 22px; font-size:16px; margin-bottom:10px; }
  </style>
</head>
<body>

<div id="app">
  <h2>🧾 POS</h2>

  <button @click="startPOS">▶ Start POS</button>
  <p><b>Purchase #:</b> {{ purchase_number }}</p>
  <p>Status: {{ status }}</p>

  <video id="video"></video>

  <h3>Scanned Items</h3>
  <table v-if="items.length">
    <tr>
      <th>Barcode</th>
      <th>Name</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Total</th>
    </tr>
    <tr v-for="i in items" :key="i.barcode">
      <td>{{ i.barcode }}</td>
      <td>{{ i.name }}</td>
      <td>₱{{ i.price }}</td>
      <td>{{ i.quantity }}</td>
      <td>₱{{ i.total_price }}</td>
    </tr>
  </table>

  <h2 v-if="items.length">Grand Total: ₱{{ grand_total }}</h2>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      purchase_number: "",
      items: [],
      grand_total: 0,
      reader: null,
      scanning: false,
      lastScan: null,
      status: "idle"
    }
  },
  methods: {
    async startPOS() {
      // create purchase
      const r = await fetch(`${API}/pos/start`, { method:"POST" });
      const d = await r.json();
      this.purchase_number = d.purchase_number;

      this.status = "camera starting";

      if (this.reader) this.reader.reset();
      this.reader = new ZXing.BrowserMultiFormatReader();

      this.reader.decodeFromVideoDevice(null, "video", async (result, err) => {
        if (result && !this.scanning) {
          this.scanning = true;
          const barcode = result.text;

          // prevent instant duplicate scans
          if (barcode === this.lastScan) {
            this.scanning = false;
            return;
          }

          this.lastScan = barcode;
          this.status = `scanned: ${barcode}`;

          try {
            await fetch(
              `${API}/pos/scan?purchase_number=${this.purchase_number}&barcode=${barcode}`,
              { method:"POST" }
            );

            await this.loadPOS();
          } catch (e) {
            alert("Scan failed");
          }

          // allow next scan after delay
          setTimeout(() => {
            this.scanning = false;
            this.lastScan = null;
            this.status = "ready for next scan";
          }, 800);
        }
      });
    },

    async loadPOS() {
      const r = await fetch(`${API}/pos/${this.purchase_number}`);
      const d = await r.json();
      this.items = d.items;
      this.grand_total = d.grand_total;
    }
  }
}).mount("#app");
</script>

</body>
</html>
