<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/vue@3"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    video { width: 100%; max-width: 400px; border:2px solid #333; }
    table { width:100%; border-collapse: collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:6px; }
    button { padding:14px 22px; font-size:16px; margin-bottom:10px; }
  </style>
</head>
<body>

<div id="app">
  <h2>🧾 POS Test</h2>

  <button @click="startPOS">▶ Start Scanner</button>
  <p>Status: {{ status }}</p>

  <video id="video"></video>

  <h3>Scanned Items</h3>
  <table v-if="items.length">
    <tr>
      <th>Barcode</th>
      <th>Name</th>
      <th>Price</th>
    </tr>
    <tr v-for="i in items" :key="i.barcode">
      <td>{{ i.barcode }}</td>
      <td>{{ i.name }}</td>
      <td>₱{{ i.price }}</td>
    </tr>
  </table>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      items: [],
      reader: null,
      scanning: false,
      lastScan: null,
      status: "idle"
    }
  },
  methods: {
    startPOS() {
      this.status = "camera starting";

      if (this.reader) this.reader.reset();
      this.reader = new ZXing.BrowserMultiFormatReader();

      this.reader.decodeFromVideoDevice(null, "video", async (result, err) => {
        if (result && !this.scanning) {
          this.scanning = true;
          const barcode = result.text;

          // prevent duplicate scans
          if (barcode === this.lastScan) {
            this.scanning = false;
            return;
          }

          this.lastScan = barcode;
          this.status = `scanned: ${barcode}`;

          try {
            // fetch product info only
            const r = await fetch(`${API}/product/${barcode}`);
            if (!r.ok) throw new Error("Product not found");
            const data = await r.json();

            this.items.push({
              barcode: data.barcode,
              name: data.name,
              price: data.price
            });

            this.status = `Product found: ${data.name} - ₱${data.price}`;
          } catch (e) {
            this.status = "Product not found";
            console.error(e);
          }

          setTimeout(() => {
            this.scanning = false;
            this.lastScan = null;
          }, 800);
        }
      });
    }
  }
}).mount("#app");
</script>

</body>
</html>
