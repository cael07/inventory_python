<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/vue@3"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    video { width: 100%; max-width: 400px; border:2px solid #333; margin-bottom:10px; }
    table { width:100%; border-collapse: collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:6px; text-align:center; }
    button { padding:8px 12px; font-size:14px; margin:2px; }
    input.qty { width:60px; text-align:center; }
    .grand-total { font-size:18px; font-weight:bold; margin-top:10px; }
    .paid-info { font-size:16px; margin-top:6px; }
    .paid-amount { color: green; font-weight:bold; }
    .diff-amount { color: red; font-weight:bold; }

    .scan-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 255, 0, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
      font-weight: bold;
      color: white;
      animation: fadeSlide 1s forwards;
      pointer-events: none;
      z-index: 9999;
    }

    @keyframes fadeSlide {
      0% { opacity: 0; transform: scale(0.7); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { opacity: 0; transform: scale(1); }
    }

    .modal {
      position: fixed;
      inset:0;
      background: rgba(0,0,0,0.5);
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .modal-box {
      background:white;
      padding:20px;
      border-radius:6px;
      width:300px;
      text-align:center;
    }
  </style>
</head>

<body>
<div id="app">

  <h2>🧾 POS</h2>

  <div style="display:flex; justify-content:space-between; align-items:center;">
    <button @click="startPOS" :disabled="posActive">▶ Start POS</button>
    <button @click="donePOS" :disabled="!posActive">✅ Done</button>
    <span class="grand-total" v-if="items.length">₱ {{ grandTotal }}</span>
  </div>

  <div class="paid-info" v-if="paidAmount !== null">
    Paid: <span class="paid-amount">₱{{ paidAmount }}</span> |
    Change/Diff: <span class="diff-amount">₱{{ diffAmount }}</span>
  </div>

  <video id="video"></video>

  <p><b>Purchase #:</b> {{ purchase_number }}</p>
  <p>Status: {{ status }}</p>

  <table v-if="items.length">
    <tr>
      <th>#</th>
      <th>Name</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Total</th>
      <th>Action</th>
    </tr>

    <tr v-for="(i, index) in items" :key="i.barcode">
      <td>{{ index + 1 }}</td>
      <td>{{ i.name }}</td>
      <td>₱{{ i.price }}</td>

      <!-- ✅ EDITABLE QTY -->
      <td>
        <input
          class="qty"
          type="number"
          min="1"
          v-model.number="i.quantity"
          @input="updateQty(index)"
        />
      </td>

      <td>₱{{ i.total_price }}</td>
      <td>
        <button @click="removeItem(index)">❌</button>
      </td>
    </tr>
  </table>

  <div v-if="showScanModal" class="scan-modal">✅ Scanned!</div>

  <!-- Paid Modal -->
  <div v-if="showPaidModal" class="modal">
    <div class="modal-box">
      <h3>Enter Paid Amount</h3>
      <input type="number" v-model.number="paidInput" placeholder="₱ Amount">
      <button @click="confirmPaid">OK</button>
    </div>
  </div>

</div>

<script>
const API = "https://inventory-python.onrender.com";
const beepSound = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=");

Vue.createApp({
  data() {
    return {
      purchase_number: "",
      items: [],
      grandTotal: 0,
      reader: null,
      scanning: false,
      lastScan: null,
      status: "idle",
      showScanModal: false,
      posActive: false,
      showPaidModal: false,
      paidInput: null,
      paidAmount: null,
      diffAmount: null
    }
  },

  methods: {
    async startPOS() {
      this.items = [];
      this.grandTotal = 0;
      this.status = "starting camera";
      this.paidAmount = null;
      this.diffAmount = null;

      const r = await fetch(`${API}/pos/start`, { method:"POST" });
      const d = await r.json();
      this.purchase_number = d.purchase_number;
      this.posActive = true;

      if (this.reader) this.reader.reset();
      this.reader = new ZXing.BrowserMultiFormatReader();

      this.reader.decodeFromVideoDevice(null, "video", async (result) => {
        if (!result || this.scanning) return;
        this.scanning = true;

        const barcode = result.text;
        if (barcode === this.lastScan) { this.scanning = false; return; }
        this.lastScan = barcode;

        try {
          const res = await fetch(`${API}/product/${barcode}`);
          if (!res.ok) throw new Error();
          const product = await res.json();

          const idx = this.items.findIndex(x => x.barcode === product.barcode);

          if (idx >= 0) {
            // ✅ ALWAYS ADD +1 (manual qty does NOT affect scan logic)
            this.items[idx].quantity += 1;
            this.items[idx].total_price =
              this.items[idx].quantity * this.items[idx].price;
          } else {
            this.items.push({
              barcode: product.barcode,
              name: product.name,
              price: product.price,
              quantity: 1,          // ✅ RESET TO 1 ON SCAN
              total_price: product.price
            });
          }

          beepSound.currentTime = 0;
          beepSound.play();

          this.showScanModal = true;
          setTimeout(() => this.showScanModal = false, 600);

          this.calculateTotal();
          this.status = `Scanned: ${barcode}`;
        } catch {
          alert("Product not found");
        }

        setTimeout(() => {
          this.scanning = false;
          this.lastScan = null;
          this.status = "ready";
        }, 700);
      });
    },

    updateQty(index) {
      const i = this.items[index];
      if (!i.quantity || i.quantity < 1) i.quantity = 1;
      i.total_price = i.quantity * i.price;
      this.calculateTotal();
    },

    calculateTotal() {
      this.grandTotal = this.items.reduce((s,i)=>s+i.total_price,0);
    },

    removeItem(index) {
      this.items.splice(index,1);
      this.calculateTotal();
    },

    donePOS() {
      this.showPaidModal = true;
      this.paidInput = null;
    },

    async confirmPaid() {
      this.paidAmount = this.paidInput;
      this.diffAmount = this.grandTotal - this.paidAmount;
      this.showPaidModal = false;
      this.posActive = false;
      if (this.reader) this.reader.reset();

      await fetch(`${API}/pos/save`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          purchase_number: this.purchase_number,
          items: this.items,
          paid_amount: this.paidAmount
        })
      });

      alert("Purchase saved!");
    }
  }
}).mount("#app");
</script>

</body>
</html>
