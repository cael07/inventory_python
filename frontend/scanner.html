<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scanner</title>
<script src="https://unpkg.com/vue@3"></script>
<script src="https://unpkg.com/@zxing/library@latest"></script>
<style>
body { font-family: Arial; padding: 0; margin: 0; background: #f5f6fa; }

/* 🔷 Top bar placeholder */
.page {
  padding: 20px;
}

/* 🔹 Inline header with wave back button */
.header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.header h2 {
  margin: 0;
  font-size: 22px;
}

/* 🌊 Wave Back Button */
.wave-btn {
  position: relative;
  display: inline-block;
  padding: 6px 12px;
  background: #1f3a5f;
  color: white;
  font-size: 15px;
  border-radius: 6px;
  text-decoration: none;
  overflow: hidden;
  white-space: nowrap;
}

.wave-btn span {
  position: relative;
  z-index: 1;
}

.wave-btn svg {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 18px;
  fill: #3498db;
}

.wave-btn svg path {
  animation: waveOscillate 2.2s ease-in-out infinite alternate;
}

@keyframes waveOscillate {
  0%   { d: path("M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"); }
  50%  { d: path("M0,8 C30,0 60,20 120,8 L120,40 L0,40 Z"); }
  100% { d: path("M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"); }
}

/* Scanner video & buttons */
video { width: 100%; max-width: 400px; border: 2px solid #333; margin-top: 10px; }
button { padding: 12px 18px; font-size: 16px; margin: 5px 5px 5px 0; }

/* Modal */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; }
.modal-box { background: #fff; padding: 20px; width: 300px; border-radius: 6px; }
input { width: 100%; padding: 6px; margin-bottom: 10px; }

/* Recent products */
.recent { margin-top: 20px; background: #a3a2a2; padding: 10px; border-radius: 6px; }
.recent h3 { margin-top: 0; }
.recent-item { font-size: 14px; padding: 6px 0; border-bottom: 1px solid #ddd; }
.recent-item:last-child { border-bottom: none; }


/* Scan Barcode button professional style */
#scan-btn {
  padding: 14px 24px;
  font-size: 18px;
  background: #3498db;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  box-shadow: 0 6px 15px rgba(0,0,0,0.2);
  transition: all 0.3s ease;
}

#scan-btn:hover {
  background: #2980b9;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  transform: translateY(-2px);
}
</style>
</head>
<body>

<div class="page">

  <!-- 🔹 Header with wave back button inline -->
  <div class="header">
    <a href="product_management.html" class="wave-btn">
      <span>⬅️ Back</span>
      <svg viewBox="0 0 120 40" preserveAspectRatio="none">
        <path d="M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"></path>
      </svg>
    </a>
    <h2>📷 Scanner</h2>
  </div>

  <div id="app">
    <button id="scan-btn" @click="startScan">Scan Barcode</button>
    <p>Status: {{ status }}</p>
    <video id="video"></video>

    <!-- ADD PRODUCT -->
    <div v-if="showModal" class="modal">
      <div class="modal-box">
        <h3>New Product</h3>
        <input v-model="form.barcode" readonly />
        <input v-model="form.name" placeholder="Product Name" />
        <input v-model="form.price" type="number" placeholder="Price" />
        <input v-model="form.quantity" type="number" placeholder="Quantity" />
        <button @click="save">Save</button>
        <button @click="cancel">Close</button>
      </div>
    </div>

    <!-- UPDATE PRODUCT -->
    <div v-if="showUpdateModal" class="modal">
      <div class="modal-box">
        <h3>Update Product</h3>
        <input v-model="updateForm.barcode" readonly />
        <input v-model="updateForm.name" readonly />
        <input v-model="updateForm.price" type="number" placeholder="Price" />
        <input v-model="updateForm.quantity" type="number" placeholder="Add Quantity" />
        <input v-model="updateForm.remark" placeholder="Remark" />
        <button @click="updateProduct">Save</button>
        <button @click="cancelUpdate">Close</button>
      </div>
    </div>

    <!-- LAST 5 FROM MONITORING -->
    <div class="recent">
      <h3>🧾 Latest 5 Products</h3>
      <div v-if="recentProducts.length === 0">No products yet</div>
      <div v-for="p in recentProducts" :key="p.id" class="recent-item">
        <b>{{ p.name }}</b><br>
        {{ p.barcode }} — ₱{{ p.price }} — Qty: {{ p.quantity }}
      </div>
    </div>
  </div>

</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      status: "Press Scan Barcode to start scanning.",
      reader: null,
      showModal: false,
      showUpdateModal: false,
      form: { barcode: "", name: "", price: 0, quantity: 0 },
      updateForm: { barcode: "", name: "", price: 0, quantity: 0, remark: "" },
      recentProducts: []
    }
  },

  mounted() {
    this.loadRecent();
  },

  methods: {
    startScan() {
      this.status = "Scanning...";
      this.reader = new ZXing.BrowserMultiFormatReader();
      this.reader.decodeFromVideoDevice(null, "video", async (result) => {
        if (result) {
          this.reader.reset();
          const barcode = result.text;

          try {
            const res = await fetch(`${API}/product/${barcode}`);
            const data = await res.json();

            if (data?.barcode) {
              this.updateForm = { barcode: data.barcode, name: data.name, price: data.price, quantity: 0, remark: "" };
              this.showUpdateModal = true;
            } else {
              this.form = { barcode, name: "", price: 0, quantity: 0 };
              this.showModal = true;
            }
          } catch {
            this.form = { barcode, name: "", price: 0, quantity: 0 };
            this.showModal = true;
          }
        }
      });
    },

    async save() {
      await fetch(`${API}/update_product/${this.form.barcode}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...this.form, total_price: this.form.price * this.form.quantity, remark: "New" })
      });
      this.cancel();
      await this.loadRecent();
      alert("Product saved");
    },

    async updateProduct() {
      await fetch(`${API}/update_product/${this.updateForm.barcode}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...this.updateForm, total_price: this.updateForm.price * this.updateForm.quantity })
      });
      this.cancelUpdate();
      await this.loadRecent();
      alert("Product updated");
    },

    async loadRecent() {
      try {
        const res = await fetch(`${API}/monitoring?page=1&limit=5`);
        const data = await res.json();
        this.recentProducts = data.items || [];
      } catch (err) {
        console.error("Error loading recent products:", err);
        this.recentProducts = [];
      }
    },

    cancel() { this.showModal = false; },
    cancelUpdate() { this.showUpdateModal = false; }
  }
}).mount("#app");
</script>

</body>
</html>
