<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Scanner</title>
  <script src="https://unpkg.com/vue@3"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    body { font-family: Arial; padding: 10px; }
    video { width: 100%; max-width: 400px; border: 2px solid #333; }
    button { padding: 12px 18px; font-size: 16px; margin: 5px 5px 5px 0; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; }
    .modal-box { background: #fff; padding: 20px; width: 300px; border-radius: 6px; }
    input { width: 100%; padding: 6px; margin-bottom: 10px; }
    .recent { margin-top: 20px; background: #f4f4f4; padding: 10px; border-radius: 6px; }
    .recent h3 { margin-top: 0; }
    .recent-item { font-size: 14px; padding: 6px 0; border-bottom: 1px solid #ddd; }
    .recent-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

<a href="product_management.html">⬅️ Back to Menu</a>

<div id="app">
  <h2>📷 Product Scanner</h2>
  <button @click="startScan">Scan Barcode</button>
  <p>Status: {{ status }}</p>
  <video id="video"></video>

  <!-- ADD PRODUCT -->
  <div v-if="showModal" class="modal">
    <div class="modal-box">
      <h3>New Product</h3>
      <input v-model="form.barcode" readonly />
      <input v-model="form.name" placeholder="Product Name" />
      <input v-model="form.price" type="number" placeholder="Price" />
      <input v-model="form.quantity" type="number" placeholder="Quantity" />
      <button @click="save">Save</button>
      <button @click="cancel">Close</button>
    </div>
  </div>

  <!-- UPDATE PRODUCT -->
  <div v-if="showUpdateModal" class="modal">
    <div class="modal-box">
      <h3>Update Product</h3>
      <input v-model="updateForm.barcode" readonly />
      <input v-model="updateForm.name" readonly />
      <input v-model="updateForm.price" type="number" placeholder="Price" />
      <input v-model="updateForm.quantity" type="number" placeholder="Add Quantity" />
      <input v-model="updateForm.remark" placeholder="Remark" />
      <button @click="updateProduct">Save</button>
      <button @click="cancelUpdate">Close</button>
    </div>
  </div>

  <!-- LAST 5 FROM MONITORING -->
  <div class="recent">
    <h3>🧾 Last 5 Products Added / Updated</h3>
    <div v-if="recentProducts.length === 0">No products yet</div>
    <div v-for="p in recentProducts" :key="p.id" class="recent-item">
      <b>{{ p.name }}</b><br>
      {{ p.barcode }} — ₱{{ p.price }} — Qty: {{ p.quantity }}
    </div>
  </div>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      status: "idle",
      reader: null,
      showModal: false,
      showUpdateModal: false,
      form: { barcode: "", name: "", price: 0, quantity: 0 },
      updateForm: { barcode: "", name: "", price: 0, quantity: 0, remark: "" },
      recentProducts: []
    }
  },

  mounted() {
    this.loadRecent();
  },

  methods: {
    startScan() {
      this.status = "Scanning...";
      this.reader = new ZXing.BrowserMultiFormatReader();

      this.reader.decodeFromVideoDevice(null, "video", async (result) => {
        if (result) {
          this.reader.reset();
          const barcode = result.text;

          try {
            const res = await fetch(`${API}/product/${barcode}`);
            const data = await res.json();

            if (data?.barcode) {
              this.updateForm = { barcode: data.barcode, name: data.name, price: data.price, quantity: 0, remark: "" };
              this.showUpdateModal = true;
            } else {
              this.form = { barcode, name: "", price: 0, quantity: 0 };
              this.showModal = true;
            }
          } catch {
            this.form = { barcode, name: "", price: 0, quantity: 0 };
            this.showModal = true;
          }
        }
      });
    },

    async save() {
      await fetch(`${API}/update_product/${this.form.barcode}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...this.form, total_price: this.form.price * this.form.quantity, remark: "New" })
      });
      this.cancel();
      await this.loadRecent(); // reload latest
      alert("Product saved");
    },

    async updateProduct() {
      await fetch(`${API}/update_product/${this.updateForm.barcode}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...this.updateForm, total_price: this.updateForm.price * this.updateForm.quantity })
      });
      this.cancelUpdate();
      await this.loadRecent(); // reload latest
      alert("Product updated");
    },

    async loadRecent() {
      try {
        const res = await fetch(`${API}/monitoring?page=1&limit=5`);
        const data = await res.json();
        this.recentProducts = data.items || [];
      } catch (err) {
        console.error("Error loading recent products:", err);
        this.recentProducts = [];
      }
    },

    cancel() { this.showModal = false; },
    cancelUpdate() { this.showUpdateModal = false; }
  }
}).mount("#app");
</script>

</body>
</html>
