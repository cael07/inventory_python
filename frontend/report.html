<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/vue@3"></script>
  <style>
    table { width:100%; border-collapse: collapse; }
    th, td { border:1px solid #ccc; padding:6px; text-align:center; }
    button { padding:10px 14px; font-size:15px; margin:10px auto; display:block; }
  </style>
</head>
<body>

<div id="app">
  <h2>📊 POS Report</h2>

  <table v-if="rows.length">
    <tr>
      <th>Date</th>
      <th>Purchase #</th>
      <th>Barcode</th>
      <th>Name</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Total</th>
    </tr>

    <tr v-for="r in rows" :key="r.id">
      <td>{{ r.date }}</td>
      <td>{{ r.purchase_number }}</td>
      <td>{{ r.barcode }}</td>
      <td>{{ r.name }}</td>
      <td>₱{{ r.price }}</td>
      <td>{{ r.quantity }}</td>
      <td>₱{{ r.total_price }}</td>
    </tr>
  </table>

  <p v-if="!rows.length && !loading">No records found</p>

  <button v-if="canLoadMore" @click="loadMore">
    {{ loading ? "Loading..." : "Load More" }}
  </button>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      rows: [],
      page: 1,
      limit: 10,
      total: 0,
      loading: false
    }
  },

  computed: {
    canLoadMore() {
      return this.rows.length < this.total && !this.loading;
    }
  },

  methods: {
    async loadMore() {
      this.loading = true;

      const res = await fetch(
        `${API}/pos/report?page=${this.page}&limit=${this.limit}`
      );
      const data = await res.json();

      this.rows.push(...data.items);
      this.total = data.total_records;
      this.page += 1;

      this.loading = false;
    }
  },

  mounted() {
    this.loadMore(); // initial load
  }
}).mount("#app");
</script>

</body>
</html>
