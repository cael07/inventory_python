<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/vue@3"></script>
  
  <!-- 🔷 Reusable Top Bar -->
  <link rel="stylesheet" href="/static/css/topbar.css">
  <link rel="icon" href="/static/img/cael.ico" type="image/x-icon">
  <script src="/static/js/topbar.js" defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 0;
    }
    table { width:100%; border-collapse: collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:6px; text-align:center; }
    button { padding:8px 12px; font-size:14px; margin:4px; }
    input { padding:6px; margin:4px; }

    .grand-total {
      font-size:18px;
      font-weight:bold;
      margin-top:12px;
      text-align:right;
    }

    /* 🌊 Back Button */
    .wave-btn {
      position: relative;
      display: inline-block;
      padding: 6px 12px;
      background: #1f3a5f;
      color: white;
      font-size: 15px;
      border-radius: 6px;
      text-decoration: none;
      overflow: hidden;
      white-space: nowrap;
    }

    .wave-btn span { position: relative; z-index: 1; }

    .wave-btn svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 18px;
      fill: #3498db;
    }

    .wave-btn svg path {
      animation: waveOscillate 2.2s ease-in-out infinite alternate;
    }

    @keyframes waveOscillate {
      0%   { d: path("M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"); }
      50%  { d: path("M0,8 C30,0 60,20 120,8 L120,40 L0,40 Z"); }
      100% { d: path("M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"); }
    }

    /* Header row */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
      margin-top: 15px;
    }

    /* Filters layout */
    .filters {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 8px;
      margin-bottom: 10px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      font-size: 12px;
    }

    .filter-group label {
      margin-bottom: 2px;
      color: #444;
    }
  </style>
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <div class="header">
    <a href="javascript:history.back()" class="wave-btn">
      <span>⬅️ Back</span>
      <svg viewBox="0 0 120 40" preserveAspectRatio="none">
        <path d="M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"></path>
      </svg>
    </a>
    <h2 style="margin:0;">📊 POS Report</h2>
  </div>

  <!-- FILTERS -->
  <div class="filters">
    <input v-model="filters.purchase_number" placeholder="Purchase #" />
    <input v-model="filters.barcode" placeholder="Barcode" />

    <div class="filter-group">
      <label>From</label>
      <input type="date" v-model="filters.date_from" />
    </div>

    <div class="filter-group">
      <label>To</label>
      <input type="date" v-model="filters.date_to" />
    </div>

    <button @click="applyFilter">🔍 Filter</button>
    <button @click="exportExcel">⬇ Export Excel</button>
  </div>

  <!-- TABLE -->
  <table v-if="rows.length">
    <tr>
      <th>#</th>
      <th>Date</th>
      <th>Purchase #</th>
      <th>Barcode</th>
      <th>Name</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Total</th>
    </tr>

    <tr v-for="(r, index) in rows" :key="r.id">
      <td>{{ index + 1 }}</td>
      <td>{{ r.date }}</td>
      <td>{{ r.purchase_number }}</td>
      <td>{{ r.barcode }}</td>
      <td>{{ r.name }}</td>
      <td>₱{{ r.price }}</td>
      <td>{{ r.quantity }}</td>
      <td>₱{{ r.total_price }}</td>
    </tr>
  </table>

  <p v-if="!rows.length && !loading">No records found</p>

  <div class="grand-total" v-if="rows.length">
    Grand Total (shown): ₱{{ grandTotal }}
  </div>

  <button v-if="canLoadMore" @click="loadMore">
    {{ loading ? "Loading..." : "Load More" }}
  </button>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      rows: [],
      page: 1,
      limit: 10,
      total: 0,
      loading: false,
      filters: {
        purchase_number: "",
        barcode: "",
        date_from: "",
        date_to: ""
      }
    }
  },

  computed: {
    canLoadMore() {
      return this.rows.length < this.total && !this.loading;
    },
    grandTotal() {
      return this.rows.reduce((sum, r) => sum + Number(r.total_price), 0).toFixed(2);
    }
  },

  methods: {
    async loadMore() {
      this.loading = true;

      const params = new URLSearchParams({
        page: this.page,
        limit: this.limit,
        ...this.filters
      });

      const res = await fetch(`${API}/pos/report?${params}`);
      const data = await res.json();

      this.rows.push(...data.items);
      this.total = data.total_records;
      this.page += 1;
      this.loading = false;
    },

    applyFilter() {
      this.rows = [];
      this.page = 1;
      this.total = 0;
      this.loadMore();
    },

    exportExcel() {
      const params = new URLSearchParams(this.filters);
      window.location = `${API}/pos/report/export?${params}`;
    }
  },

  mounted() {
    this.loadMore();
  }
}).mount("#app");
</script>

</body>
</html>
