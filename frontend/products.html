<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Products</title>

  <!-- Vue -->
  <script src="https://unpkg.com/vue@3"></script>

  <!-- 🔷 Reusable Top Bar -->
  <link rel="stylesheet" href="/static/css/topbar.css">
  <link rel="icon" href="/static/img/cael.ico" type="image/x-icon">
  <script src="/static/js/topbar.js" defer></script>

  <style>
    html, body {
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 0;
    }

    /* Page padding */
    .page {
      padding: 20px;
    }

    /* Header row */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
    }

    /* ✅ TABLE SCROLL CONTAINER */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      min-width: 600px; /* Allows safe columns on small screens */
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      background: #fff;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      font-size: 14px;
      text-align: center;
      white-space: nowrap;
    }

    .loader {
      text-align: center;
      padding: 10px;
    }

    /* 🔍 Search bar fix */
    .search-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }

    .search-bar input {
      flex: 1 1 100%;
      padding: 8px;
      font-size: 16px;
    }

    .search-bar button {
      padding: 8px 14px;
      font-size: 14px;
    }

    .clear-btn {
      background: #e74c3c;
      color: white;
      border: none;
      border-radius: 4px;
    }

    /* 🌊 Back Button */
    .wave-btn {
      position: relative;
      display: inline-block;
      padding: 6px 12px;
      background: #1f3a5f;
      color: white;
      font-size: 15px;
      border-radius: 6px;
      text-decoration: none;
      overflow: hidden;
      white-space: nowrap;
    }

    .wave-btn span {
      position: relative;
      z-index: 1;
    }

    .wave-btn svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 18px;
      fill: #3498db;
    }

    .wave-btn svg path {
      animation: waveOscillate 2.2s ease-in-out infinite alternate;
    }

    @keyframes waveOscillate {
      0%   { d: path("M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"); }
      50%  { d: path("M0,8 C30,0 60,20 120,8 L120,40 L0,40 Z"); }
      100% { d: path("M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"); }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- 🔹 Inline Header -->
  <div class="header">
    <a href="dashboard.html" class="wave-btn">
      <span>⬅️ Back</span>
      <svg viewBox="0 0 120 40" preserveAspectRatio="none">
        <path d="M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"></path>
      </svg>
    </a>

    <h2>📦 All Products</h2>
  </div>

  <div id="app">
    <!-- 🔍 Manual Search -->
    <div class="search-bar">
      <input
        v-model="search"
        @keyup.enter="doSearch"
        placeholder="Search barcode or name..."
      >

      <button @click="doSearch">
        🔍 Search
      </button>

      <button v-if="search" @click="clearSearch" class="clear-btn">
        ❌ Clear
      </button>
    </div>

    <div class="table-wrap">
      <table v-if="rows.length">
        <tr>
          <th>#</th>
          <th>Barcode</th>
          <th>Name</th>
          <th>Price</th>
          <th>Qty</th>
        </tr>

        <tr v-for="(p, i) in rows" :key="p.id">
          <td>{{ i + 1 }}</td>
          <td>{{ p.barcode }}</td>
          <td>{{ p.name }}</td>
          <td>₱{{ p.price }}</td>
          <td>{{ p.quantity }}</td>
        </tr>
      </table>
    </div>

    <div class="loader" v-if="loading">Loading...</div>
    <div class="loader" v-if="!loading && rows.length === 0">No records found</div>
    <div class="loader" v-if="rows.length > 0 && !canLoadMore && !loading">
      End of list
    </div>
  </div>

</div>

<script>
const API = window.CONFIG_API || "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      rows: [],
      page: 1,
      limit: 25,
      total: 0,
      loading: false,
      search: "",        // 👈 NEW
      searching: false   // 👈 NEW
    }
  },

  computed: {
    canLoadMore() {
      return this.rows.length < this.total;
    }
  },

  methods: {
async loadMore() {
  if (this.loading || this.searching) return;
  this.loading = true;

  try {
    const res = await fetch(`${API}/products?page=${this.page}&limit=${this.limit}`);
    const data = await res.json();

    if (data.items && data.items.length) {
      this.rows.push(...data.items);
    }

    this.total = data.total_records;
    this.page++;
  } catch (e) {
    console.error(e);
  } finally {
    this.loading = false;
  }
},
async doSearch() {
  if (!this.search) return;

  this.searching = true;
  this.loading = true;

  try {
    const res = await fetch(
      `${API}/products_manual_search?search=${encodeURIComponent(this.search)}`
    );
    const data = await res.json();
    this.rows = data.items || [];
  } catch (e) {
    console.error(e);
  } finally {
    this.loading = false;
  }
},

clearSearch() {
  this.search = "";
  this.searching = false;
  this.rows = [];
  this.page = 1;
  this.loadMore();
},

    handleScroll() {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 50) {
        this.loadMore();
      }
    }
  },

  mounted() {
    this.loadMore();
    window.addEventListener("scroll", this.handleScroll);
  }
}).mount("#app");
</script>

</body>
</html>
