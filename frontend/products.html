<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Products</title>

  <!-- Vue -->
  <script src="https://unpkg.com/vue@3"></script>

  <!-- 🔷 Reusable Top Bar -->
  <link rel="stylesheet" href="/static/css/topbar.css">
  <script src="/static/js/topbar.js" defer></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 0;
    }

    .page {
      padding: 20px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 6px;
      text-align: center;
    }

    .loader {
      text-align: center;
      padding: 10px;
    }

    /* 🌊 Back Button */
    .wave-btn {
      position: relative;
      display: inline-block;
      padding: 6px 12px;
      background: #1f3a5f;
      color: white;
      font-size: 15px;
      border-radius: 6px;
      text-decoration: none;
      overflow: hidden;
      white-space: nowrap;
    }

    .wave-btn span {
      position: relative;
      z-index: 1;
    }

    .wave-btn svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 18px;
      fill: #3498db;
    }

    .wave-btn svg path {
      animation: waveOscillate 2.2s ease-in-out infinite alternate;
    }

    @keyframes waveOscillate {
      0%   { d: path("M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"); }
      50%  { d: path("M0,8 C30,0 60,20 120,8 L120,40 L0,40 Z"); }
      100% { d: path("M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"); }
    }

    /* Search */
    .search-box {
      margin-bottom: 10px;
    }

    .search-box input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

<div class="page">

  <!-- 🔹 Inline Header -->
  <div class="header">
    <a href="product_management.html" class="wave-btn">
      <span>⬅️ Back</span>
      <svg viewBox="0 0 120 40" preserveAspectRatio="none">
        <path d="M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"></path>
      </svg>
    </a>

    <h2>📦 All Products</h2>
  </div>

  <div id="app">

    <!-- 🔍 SEARCH -->
<div class="search-box" style="display:flex; gap:6px;">
  <input
    v-model="tempSearch"
    @keyup.enter="applySearch"
    placeholder="Search by barcode or product name..."
  />
  <button @click="applySearch" style="padding:10px;">
    🔍 Search
  </button>
</div>


    <table v-if="filteredRows.length">
      <tr>
        <th>#</th>
        <th>Barcode</th>
        <th>Name</th>
        <th>Price</th>
        <th>Qty</th>
      </tr>

      <tr v-for="(p, i) in filteredRows" :key="p.id">
        <td>{{ i + 1 }}</td>
        <td>{{ p.barcode }}</td>
        <td>{{ p.name }}</td>
        <td>₱{{ p.price }}</td>
        <td>{{ p.quantity }}</td>
      </tr>
    </table>

    <div class="loader" v-if="loading">Loading...</div>
    <div class="loader" v-if="!loading && filteredRows.length === 0">
      No records found
    </div>
    <div class="loader" v-if="rows.length > 0 && !canLoadMore && !loading">
      End of list
    </div>
  </div>

</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
data() {
  return {
    rows: [],
    page: 1,
    limit: 25,
    total: 0,
    loading: false,
    searchQuery: "",
    tempSearch: ""
  }
},

  computed: {
    canLoadMore() {
      return this.rows.length < this.total;
    },

    filteredRows() {
      if (!this.searchQuery) return this.rows;

      const q = this.searchQuery.toLowerCase();

      return this.rows.filter(p =>
        (p.barcode && p.barcode.toLowerCase().includes(q)) ||
        (p.name && p.name.toLowerCase().includes(q))
      );
    }
  },

  methods: {
    async loadMore() {
      if (this.loading) return;
      this.loading = true;

      try {
        const res = await fetch(`${API}/products?page=${this.page}&limit=${this.limit}`);
        const data = await res.json();

        if (data.items && data.items.length) {
          this.rows.push(...data.items);
        }

        this.total = data.total_records;
        this.page++;
      } catch (e) {
        console.error(e);
      } finally {
        this.loading = false;
      }
    },
  applySearch() {
    this.searchQuery = this.tempSearch.trim();
  },
    handleScroll() {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 50) {
        this.loadMore();
      }
    }
  },

  mounted() {
    this.loadMore();
    window.addEventListener("scroll", this.handleScroll);
  }
}).mount("#app");
</script>

</body>
</html>
