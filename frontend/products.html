<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/vue@3"></script>
  <style>
    table{ width:100%; border-collapse:collapse; }
    th,td{ border:1px solid #ccc; padding:6px; text-align:center; }
  </style>
</head>

<body>
<a href="index.html">⬅️ Back</a>

<div id="app">
  <h2>📦 Products</h2>

  <table>
    <tr>
      <th>#</th><th>Barcode</th><th>Name</th><th>Price</th><th>Qty</th>
    </tr>
    <tr v-for="(p,i) in products" :key="p.id">
      <td>{{ i+1 }}</td>
      <td>{{ p.barcode }}</td>
      <td>{{ p.name }}</td>
      <td>₱{{ p.price }}</td>
      <td>{{ p.quantity }}</td>
    </tr>
  </table>
</div>

<script>
const API="https://inventory-python.onrender.com";
Vue.createApp({
  data(){ return{ products:[] } },
  mounted(){
    fetch(`${API}/products`)
      .then(r=>r.json())
      .then(d=>this.products=d);
  }
}).mount("#app");
</script>
</body>
</html>
