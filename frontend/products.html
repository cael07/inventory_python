<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Products</title>
  <script src="https://unpkg.com/vue@3"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
    }

    table {
      width:100%;
      border-collapse: collapse;
      margin-top:10px;
    }

    th, td {
      border:1px solid #ccc;
      padding:6px;
      text-align:center;
    }

    .loader {
      text-align:center;
      padding:10px;
    }

    /* 🌊 Back Button (compact, left aligned) */
    .wave-btn {
      position: relative;
      display: inline-block;
      padding: 6px 12px;          /* compact padding */
      margin-bottom: 12px;
      background: #1f3a5f;        /* dark blue */
      color: white;
      font-size: 15px;
      border-radius: 6px;
      text-decoration: none;
      overflow: hidden;
    }

    .wave-btn span {
      position: relative;
      z-index: 1;
      white-space: nowrap;
    }

    .wave-btn svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 18px;
      fill: #3498db;              /* blue wave */
    }

    .wave-btn svg path {
      animation: waveOscillate 2.2s ease-in-out infinite alternate;
    }

    /* Smooth ocean seesaw wave */
    @keyframes waveOscillate {
      0% {
        d: path("M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z");
      }
      50% {
        d: path("M0,8 C30,0 60,20 120,8 L120,40 L0,40 Z");
      }
      100% {
        d: path("M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z");
      }
    }
  </style>
</head>
<body>

<!-- 🌊 Compact Back Button -->
<a href="product_management.html" class="wave-btn">
  <span>⬅️ Back</span>
  <svg viewBox="0 0 120 40" preserveAspectRatio="none">
    <path d="M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"></path>
  </svg>
</a>

<h2>📦 All Products</h2>

<div id="app">
  <table v-if="rows.length">
    <tr>
      <th>#</th>
      <th>Barcode</th>
      <th>Name</th>
      <th>Price</th>
      <th>Qty</th>
    </tr>
    <tr v-for="(p, i) in rows" :key="p.id">
      <td>{{ i + 1 }}</td>
      <td>{{ p.barcode }}</td>
      <td>{{ p.name }}</td>
      <td>₱{{ p.price }}</td>
      <td>{{ p.quantity }}</td>
    </tr>
  </table>

  <div class="loader" v-if="loading">Loading...</div>
  <div class="loader" v-if="!loading && rows.length === 0">No records found</div>
  <div class="loader" v-if="rows.length > 0 && !canLoadMore && !loading">End of list</div>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      rows: [],
      page: 1,
      limit: 25,
      total: 0,
      loading: false
    }
  },

  computed: {
    canLoadMore() {
      return this.rows.length < this.total;
    }
  },

  methods: {
    async loadMore() {
      if (this.loading) return;
      this.loading = true;

      try {
        const res = await fetch(`${API}/products?page=${this.page}&limit=${this.limit}`);
        const data = await res.json();

        if (data.items && data.items.length > 0) {
          this.rows.push(...data.items);
        }

        this.total = data.total_records;
        this.page++;
      } catch (err) {
        console.error(err);
      } finally {
        this.loading = false;
      }
    },

    handleScroll() {
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 50) {
        this.loadMore();
      }
    }
  },

  mounted() {
    this.loadMore();
    window.addEventListener("scroll", this.handleScroll);
  }
}).mount("#app");
</script>

</body>
</html>
