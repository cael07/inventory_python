<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All Products</title>
  <script src="https://unpkg.com/vue@3"></script>
  <style>
    table { width:100%; border-collapse: collapse; margin-top:10px; }
    th, td { border:1px solid #ccc; padding:6px; text-align:center; }
    .loader { text-align:center; padding:10px; }
  </style>
</head>
<body>

<a href="product_management.html">⬅️ Back</a>
<h2>📦 All Products</h2>

<div id="app">
  <!-- Table -->
  <table v-if="rows.length">
    <tr>
      <th>#</th>
      <th>Barcode</th>
      <th>Name</th>
      <th>Price</th>
      <th>Qty</th>
    </tr>
    <tr v-for="(p, i) in rows" :key="p.id">
      <td>{{ i + 1 }}</td>
      <td>{{ p.barcode }}</td>
      <td>{{ p.name }}</td>
      <td>₱{{ p.price }}</td>
      <td>{{ p.quantity }}</td>
    </tr>
  </table>

  <!-- Loading -->
  <div class="loader" v-if="loading">Loading...</div>

  <!-- No records -->
  <div class="loader" v-if="!loading && rows.length === 0">No records found</div>

  <!-- End of list -->
  <div class="loader" v-if="rows.length > 0 && !canLoadMore && !loading">End of list</div>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      rows: [],
      page: 1,
      limit: 25,
      total: 0,
      loading: false
    }
  },

  computed: {
    canLoadMore() {
      return this.rows.length < this.total;
    }
  },

  methods: {
    async loadMore() {
      if (this.loading) return; // allow loading even if rows.length == total
      this.loading = true;

      try {
        const res = await fetch(`${API}/products?page=${this.page}&limit=${this.limit}`);
        const data = await res.json();

        // push items if any
        if (data.items && data.items.length > 0) {
          this.rows.push(...data.items);
        }
        this.total = data.total_records;
        this.page++;
      } catch (err) {
        console.error("Error loading products:", err);
      } finally {
        this.loading = false;
      }
    },

    handleScroll() {
      if (
        window.innerHeight + window.scrollY >=
        document.body.offsetHeight - 50
      ) {
        this.loadMore();
      }
    }
  },

  mounted() {
    this.loadMore();
    window.addEventListener("scroll", this.handleScroll);
  }
}).mount("#app");
</script>

</body>
</html>
