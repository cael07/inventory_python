<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/vue@3"></script>
  <style>
    body { font-family: Arial; background:#f4f4f4; }
    .box { max-width:360px; margin:40px auto; background:white; padding:20px; border-radius:6px; }
    input, button { width:100%; padding:8px; margin:6px 0; }
    button { background:#1f3a5f; color:white; border:none; }
  </style>
</head>
<body>

<div id="app" class="box">
  <h2>🔐 Login</h2>

  <input v-model="username" placeholder="Username">
  <input type="password" v-model="password" placeholder="Password">

  <button @click="login">Login</button>

  <p>{{ message }}</p>

  <p>
    No account?
    <a href="register.html">Register</a>
  </p>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return { username:"", password:"", message:"" }
  },
  methods:{
    async login() {
      const r = await fetch(`${API}/login?username=${this.username}&password=${this.password}`, {
        method:"POST"
      });
      const d = await r.json();

      if (d.status === "ok") {
        localStorage.setItem("user", JSON.stringify(d.user));
        window.location.href = "dashboard.html"; // your POS page
      } else {
        this.message = d.detail || "Login failed";
      }
    }
  }
}).mount("#app");
</script>

</body>
</html>
