<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Inventory</title>
  <link rel="icon" href="/static/img/cael.ico" type="image/x-icon">
  <script src="https://unpkg.com/vue@3"></script>
  <style>
    /* ---------- GLOBAL ---------- */
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #00ffff;
    }

    /* ---------- CARD ---------- */
    .box {
      max-width: 380px;
      width: 100%;
      background: rgba(20, 20, 35, 0.95);
      padding: 40px 30px;
      border-radius: 12px;
      text-align: center;
      position: relative;
      color: #fff;
      animation: flicker 1.5s infinite alternate;
    }

    @keyframes flicker {
      0% { box-shadow: 0 0 10px #00ffff, 0 0 20px #00aaff; }
      25% { box-shadow: 0 0 15px #00ffff, 0 0 25px #00aaff; }
      50% { box-shadow: 0 0 12px #00ffff, 0 0 18px #00aaff; }
      75% { box-shadow: 0 0 16px #00ffff, 0 0 22px #00aaff; }
      100% { box-shadow: 0 0 14px #00ffff, 0 0 20px #00aaff; }
    }

    .box img.logo {
      width: 80px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0 0 20px 0;
      font-weight: 500;
      color: #00ffff;
    }

    /* ---------- INPUTS & BUTTON ---------- */
    input, button {
      width: 100%;
      box-sizing: border-box;  /* ✅ ensure same width */
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: none;
      font-size: 14px;
    }

    input {
      background: rgba(255, 255, 255, 0.05);
      color: #00ffff;
    }

    input::placeholder {
      color: #00aaff;
    }

    button {
      background: #00ffff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 0 10px #00ffff, 0 0 20px #00aaff;
    }

    button:hover {
      background: #00ccff;
      box-shadow: 0 0 20px #00ffff, 0 0 30px #00aaff;
    }

    button:disabled {
      background: #333;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* ---------- TEXT ---------- */
    p {
      margin: 12px 0 0 0;
      font-size: 14px;
    }

    a {
      color: #00ffff;
      text-decoration: none;
      cursor: pointer;
      transition: 0.2s;
    }

    a:hover {
      text-decoration: underline;
      color: #00ccff;
    }

    /* ---------- PASSWORD TOGGLE ---------- */
    .password-container {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }
    
    .password-container input {
      padding-right: 40px;
    }
    
    .toggle-password {
      position: absolute;
      right: 12px;
      cursor: pointer;
      color: #00ffff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }
    
    .toggle-password:hover {
      color: #00ccff;
    }

    .error {
      color: #ff3333;
      font-size: 13px;
      margin: 4px 0 0 0;
      text-align: left;
    }

    /* ---------- MOBILE FIX ---------- */
    @media (max-width: 420px) {
      .box {
        margin: 20px;
        padding: 30px 20px;
      }
    }

  </style>
</head>
<body>

<div id="app" class="box">
  <!-- Logo -->
  <img class="logo" src="/static/img/cael.ico" alt="Logo">

  <!-- Inputs -->
  <input v-model="username" placeholder="Username">
  <div class="password-container">
    <input :type="showPassword ? 'text' : 'password'" v-model="password" placeholder="Password">
    <span class="toggle-password" @click="showPassword = !showPassword">
      <svg v-if="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      <svg v-else xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
    </span>
  </div>

  <!-- Login Button -->
  <button @click="login" :disabled="loading">
    {{ loading ? "Logging in..." : "Login" }}
  </button>

  <!-- Message -->
  <p v-if="message" :class="{'error': error}">{{ message }}</p>

  <!-- Register Link -->
  <p>
    No account?
    <a href="register.html">Register</a>
  </p>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      username: "",
      password: "",
      showPassword: false,
      message: "",
      error: false,
      loading: false
    }
  },
  methods: {
    async login() {
      this.message = "";
      this.error = false;
      this.loading = true;

      try {
        const r = await fetch(`${API}/login?username=${this.username}&password=${this.password}`, {
          method: "POST"
        });

        const d = await r.json();

        if (!r.ok) {
          this.message = d.detail || "Login failed";
          this.error = true;
        } else {
          // ✅ Save session token and user
          localStorage.setItem("token", d.access_token || "demo-token");
          localStorage.setItem("user", JSON.stringify(d.user));

          // Redirect to dashboard
          window.location.href = "dashboard.html";
        }
      } catch (e) {
        this.message = "Server not responding";
        this.error = true;
      } finally {
        this.loading = false;
      }
    }
  }
}).mount("#app");
</script>

</body>
</html>
