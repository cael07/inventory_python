<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Management</title>

<!-- 🔷 Reusable Top Bar -->
<link rel="stylesheet" href="/static/css/topbar.css">
  <link rel="icon" href="/static/img/cael.ico" type="image/x-icon">
<script src="/static/js/topbar.js" defer></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  margin: 0;
  padding: 0; /* remove page padding for topbar */
}

/* Page content padding */
.page {
  padding: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

.menu {
  max-width: 400px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* 🔹 MENU BUTTON */
.menu-btn {
  display: block;
  padding: 18px;
  text-align: center;
  font-size: 18px;
  background: #2c3e50;
  border-radius: 8px;
  text-decoration: none;
  overflow: hidden;
}

/* Animated text wrapper */
.menu-btn span {
  display: inline-block;
  animation: textWave 4s ease-in-out infinite;
}

/* Scanner: blue theme */
.menu-btn.scanner span {
  --start-color: #ecf0f1;
  --color1: #5dade2;
  --color2: #48c9b0;
  --color3: #85c1e9;
  animation-name: textWaveBlue;
}

/* Products: red theme */
.menu-btn.products span {
  --start-color: #f0e5e5;
  --color1: #e74c3c;
  --color2: #ec7063;
  --color3: #f1948a;
  animation-name: textWaveRed;
}

/* Monitoring: green theme */
.menu-btn.monitoring span {
  --start-color: #e8f8f5;
  --color1: #27ae60;
  --color2: #2ecc71;
  --color3: #58d68d;
  animation-name: textWaveGreen;
}

/* Dashboard button (gray, static) */
.menu-btn.dashboard {
  background: #7f8c8d;
}

.menu-btn.dashboard span {
  animation: none;
  color: #ffffff;
}

/* 🔹 ANIMATION KEYFRAMES */
@keyframes textWaveBlue {
  0%   { color: var(--start-color); }
  25%  { color: var(--color1); }
  50%  { color: var(--color2); }
  75%  { color: var(--color3); }
  100% { color: var(--start-color); }
}

@keyframes textWaveRed {
  0%   { color: var(--start-color); }
  25%  { color: var(--color1); }
  50%  { color: var(--color2); }
  75%  { color: var(--color3); }
  100% { color: var(--start-color); }
}

@keyframes textWaveGreen {
  0%   { color: var(--start-color); }
  25%  { color: var(--color1); }
  50%  { color: var(--color2); }
  75%  { color: var(--color3); }
  100% { color: var(--start-color); }
}

/* Faster animation on hover */
.menu-btn:hover span {
  animation-duration: 1.5s;
}
</style>
</head>
<body>

<div class="page">
  <h2>➕ Add Product</h2>

  <div class="menu">
    <a href="scanner.html" class="menu-btn scanner">
      <span>📷 Product Scanner</span>
    </a>

    <!-- Dashboard button (static gray) -->
    <a href="dashboard.html" class="menu-btn dashboard">
      <span>⬅️ Back to Dashboard</span>
    </a>
  </div>
</div>

</body>
</html>
