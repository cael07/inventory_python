<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Management</title>

<!-- 🔷 Reusable Top Bar -->
<link rel="stylesheet" href="/static/css/topbar.css">
<script src="/static/js/topbar.js" defer></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  margin: 0;
  padding: 0; /* remove default page padding */
}

/* Page content */
.page {
  padding: 20px;
  margin-top: 50px; /* same as topbar height */
}

/* Inline header row */
.header {
  display: flex;
  align-items: center; /* vertical center */
  gap: 10px;
  margin-bottom: 15px;
}

/* Inline h2 */
.header h2 {
  margin: 0;
  font-size: 20px;
  line-height: 1.2; /* compact line */
}

/* Menu container */
.menu {
  max-width: 400px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* Menu buttons */
.menu-btn {
  display: block;
  padding: 8px 14px; /* compact padding */
  font-size: 16px;
  text-align: center;
  border-radius: 6px;
  background: #2c3e50;
  color: white;
  text-decoration: none;
  overflow: hidden;
}

/* Animated text */
.menu-btn span {
  display: inline-block;
  animation: textWave 4s ease-in-out infinite;
  line-height: 1.2;
}

/* Scanner: blue theme */
.menu-btn.scanner span {
  --start-color: #ecf0f1;
  --color1: #5dade2;
  --color2: #48c9b0;
  --color3: #85c1e9;
  animation-name: textWaveBlue;
}

/* Products: red theme */
.menu-btn.products span {
  --start-color: #f0e5e5;
  --color1: #e74c3c;
  --color2: #ec7063;
  --color3: #f1948a;
  animation-name: textWaveRed;
}

/* Monitoring: green theme */
.menu-btn.monitoring span {
  --start-color: #e8f8f5;
  --color1: #27ae60;
  --color2: #2ecc71;
  --color3: #58d68d;
  animation-name: textWaveGreen;
}

/* Dashboard button (gray, static) */
.menu-btn.dashboard {
  background: #7f8c8d;
}
.menu-btn.dashboard span {
  animation: none;
  color: #ffffff;
}

/* Keyframes for animated text */
@keyframes textWaveBlue {
  0%   { color: var(--start-color); }
  25%  { color: var(--color1); }
  50%  { color: var(--color2); }
  75%  { color: var(--color3); }
  100% { color: var(--start-color); }
}
@keyframes textWaveRed {
  0%   { color: var(--start-color); }
  25%  { color: var(--color1); }
  50%  { color: var(--color2); }
  75%  { color: var(--color3); }
  100% { color: var(--start-color); }
}
@keyframes textWaveGreen {
  0%   { color: var(--start-color); }
  25%  { color: var(--color1); }
  50%  { color: var(--color2); }
  75%  { color: var(--color3); }
  100% { color: var(--start-color); }
}

/* Faster animation on hover */
.menu-btn:hover span {
  animation-duration: 1.5s;
}
</style>
</head>
<body>

<!-- 🔷 TOP BAR -->
<div class="topbar">
  <!-- optional logo -->
</div>

<div class="page">
  <!-- Inline header -->
  <div class="header">
    <a href="index.html" class="menu-btn dashboard">
      <span>⬅️ Back</span>
    </a>
    <h2>📦 Product Management</h2>
  </div>

  <div class="menu">
    <a href="scanner.html" class="menu-btn scanner">
      <span>📷 Product Scanner</span>
    </a>

    <a href="products.html" class="menu-btn products">
      <span>📦 View All Products</span>
    </a>

    <a href="monitoring.html" class="menu-btn monitoring">
      <span>📝 Monitoring Log</span>
    </a>

    <a href="index.html" class="menu-btn dashboard">
      <span>⬅️ Back to Dashboard</span>
    </a>
  </div>
</div>

</body>
</html>
