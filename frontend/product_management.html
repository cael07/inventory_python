<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Management</title>

<!-- 🔷 Reusable Top Bar -->
<link rel="stylesheet" href="/static/css/topbar.css">
<script src="/static/js/topbar.js" defer></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  margin: 0;
  padding: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

.menu {
  max-width: 400px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* 🔹 MENU BUTTON */
.menu-btn {
  display: block;
  padding: 18px;
  text-align: center;
  font-size: 18px;
  background: #2c3e50;
  border-radius: 8px;
  text-decoration: none;
  overflow: hidden;
}

/* 🌈 Animated text */
.menu-btn span {
  display: inline-block;
  animation: textWave 4s ease-in-out infinite;
}

/* Faster animation on hover */
.menu-btn:hover span {
  animation-duration: 1.5s;
}

/* Dashboard button (NO animation) */
.dashboard {
  background: #7f8c8d;
}

.dashboard span {
  animation: none;
  color: #ffffff;
}

/* 🌊 TEXT COLOR ANIMATION */
@keyframes textWave {
  0%   { color: #ecf0f1; }
  25%  { color: #5dade2; }
  50%  { color: #48c9b0; }
  75%  { color: #85c1e9; }
  100% { color: #ecf0f1; }
}
</style>
</head>

<body>

<h2>📦 Product Management</h2>

<div class="menu">
  <a href="scanner.html" class="menu-btn">
    <span>📷 Product Scanner</span>
  </a>

  <a href="products.html" class="menu-btn">
    <span>📦 View All Products</span>
  </a>

  <a href="monitoring.html" class="menu-btn">
    <span>📝 Monitoring Log</span>
  </a>

  <!-- Dashboard button (static gray) -->
  <a href="index.html" class="menu-btn dashboard">
    <span>⬅️ Back to Dashboard</span>
  </a>
</div>

</body>
</html>
