<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Management</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  margin: 0;
  padding: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

.menu {
  max-width: 400px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* All regular buttons with wave */
.wave-btn {
  position: relative;
  display: block;
  padding: 18px;
  text-align: center;
  font-size: 18px;
  color: white;
  background: #2c3e50;
  border-radius: 8px;
  overflow: hidden;
  text-decoration: none;
  cursor: pointer;
}

/* Wave overlay */
.wave-btn svg {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 40px;
  fill: #3498db; /* blue wave */
}

/* Animated seesaw wave */
.wave-btn svg path {
  animation: waveOscillate 2s ease-in-out infinite alternate;
}

/* Keep text above wave */
.wave-btn span {
  position: relative;
  z-index: 1;
}

/* Hover color change */
.wave-btn:hover {
  background: #34495e;
}

/* Dashboard button - plain gray, no wave */
.dashboard {
  background: #7f8c8d;
  color: white;
  position: relative;
  overflow: hidden;
}

/* Remove wave SVG for dashboard */
.dashboard svg {
  display: none;
}

/* Ripple effect for dashboard */
.dashboard:after {
  content: '';
  position: absolute;
  border-radius: 50%;
  transform: scale(0);
  background: radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 80%);
  opacity: 0;
  pointer-events: none;
}

/* Animate ripple */
.ripple {
  animation: rippleEffect 0.6s linear;
}

@keyframes waveOscillate {
  0%   { d: path("M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"); }
  50%  { d: path("M0,10 C30,0 60,30 120,10 L120,40 L0,40 Z"); }
  100% { d: path("M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"); }
}

@keyframes rippleEffect {
  to {
    transform: scale(4);
    opacity: 0;
  }
}
</style>
</head>
<body>

<h2>📦 Product Management</h2>

<div class="menu">
  <a href="scanner.html" class="wave-btn">
    <span>📷 Product Scanner</span>
    <svg viewBox="0 0 120 40" preserveAspectRatio="none">
      <path d="M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"></path>
    </svg>
  </a>

  <a href="products.html" class="wave-btn">
    <span>📦 View All Products</span>
    <svg viewBox="0 0 120 40" preserveAspectRatio="none">
      <path d="M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"></path>
    </svg>
  </a>

  <a href="monitoring.html" class="wave-btn">
    <span>📝 Monitoring Log</span>
    <svg viewBox="0 0 120 40" preserveAspectRatio="none">
      <path d="M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"></path>
    </svg>
  </a>

  <!-- Dashboard button plain gray, ripple on click -->
  <a href="index.html" class="dashboard" id="dashboardBtn">
    <span>⬅️ Back to Dashboard</span>
  </a>
</div>

<script>
// Add proper click ripple for dashboard button
const dashboardBtn = document.getElementById('dashboardBtn');

dashboardBtn.addEventListener('click', function(e) {
  const circle = document.createElement('span');
  const diameter = Math.max(this.clientWidth, this.clientHeight);
  const radius = diameter / 2;
  
  circle.style.width = circle.style.height = `${diameter}px`;
  circle.style.left = `${e.clientX - this.getBoundingClientRect().left - radius}px`;
  circle.style.top = `${e.clientY - this.getBoundingClientRect().top - radius}px`;
  circle.classList.add('ripple');
  circle.style.position = 'absolute';
  circle.style.borderRadius = '50%';
  circle.style.background = 'radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0) 80%)';
  circle.style.pointerEvents = 'none';
  
  this.appendChild(circle);
  
  circle.addEventListener('animationend', () => circle.remove());
});
</script>

</body>
</html>
