<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Management</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .menu {
      max-width: 400px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    a {
      position: relative;
      display: block;
      text-decoration: none;
      background: #2c3e50;
      color: white;
      padding: 18px;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      overflow: hidden;
    }

    /* Ocean wave using pseudo element */
    a::before {
      content: "";
      position: absolute;
      bottom: 0;
      left: 0;
      width: 200%;
      height: 100%;
      background: rgba(255,255,255,0.2);
      border-radius: 100%;
      animation: wave 4s linear infinite;
      transform: translateY(0);
      z-index: 0;
    }

    /* Move the wave up/down with sine-like motion */
    @keyframes wave {
      0%   { transform: translateX(-50%) translateY(0); }
      25%  { transform: translateX(-25%) translateY(-5px); }
      50%  { transform: translateX(0%) translateY(0); }
      75%  { transform: translateX(25%) translateY(5px); }
      100% { transform: translateX(50%) translateY(0); }
    }

    /* Keep text above the wave */
    a span {
      position: relative;
      z-index: 1;
    }

    /* Hover changes color */
    a:hover {
      background: #34495e;
    }

    .back {
      background: #7f8c8d;
    }

    .back:hover {
      background: #95a5a6;
    }
  </style>
</head>

<body>

<h2>📦 Product Management</h2>

<div class="menu">
  <a href="scanner.html"><span>📷 Product Scanner</span></a>
  <a href="products.html"><span>📦 View All Products</span></a>
  <a href="monitoring.html"><span>📝 Monitoring Log</span></a>
  <a href="index.html" class="back"><span>⬅️ Back to Dashboard</span></a>
</div>

</body>
</html>
