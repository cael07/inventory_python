<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Management</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .menu {
      max-width: 400px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    a {
      position: relative;
      display: block;
      text-decoration: none;
      background: #2c3e50;
      color: white;
      padding: 18px;
      border-radius: 8px;
      text-align: center;
      font-size: 18px;
      overflow: hidden;
    }

    /* Continuous wave */
    a::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: rgba(255,255,255,0.15);
      transform: skewX(-25deg);
      animation: wave 2s linear infinite;
    }

    @keyframes wave {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    /* Hover color change */
    a:hover {
      background: #34495e;
    }

    /* Back button style */
    .back {
      background: #7f8c8d;
    }

    .back:hover {
      background: #95a5a6;
    }
  </style>
</head>

<body>

<h2>📦 Product Management</h2>

<div class="menu">
  <a href="scanner.html">📷 Product Scanner</a>
  <a href="products.html">📦 View All Products</a>
  <a href="monitoring.html">📝 Monitoring Log</a>
  <a href="index.html" class="back">⬅️ Back to Dashboard</a>
</div>

</body>
</html>
