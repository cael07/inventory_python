<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Management</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  margin: 0;
  padding: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

.menu {
  max-width: 400px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* Button wrapper */
.wave-btn {
  position: relative;
  display: block;
  padding: 18px;
  text-align: center;
  font-size: 18px;
  color: white;
  background: #2c3e50;
  border-radius: 8px;
  overflow: hidden;
  text-decoration: none;
}

/* Wave overlay */
.wave-btn svg {
  position: absolute;
  bottom: 0;         /* lower wave */
  left: 0;
  width: 100%;
  height: 40px;      /* wave height */
  fill: #3498db;     /* blue color */
}

/* Animate wave like seesaw */
.wave-btn svg path {
  animation: waveOscillate 2s ease-in-out infinite alternate;
}

/* Keep text above wave */
.wave-btn span {
  position: relative;
  z-index: 1;
}

/* Hover color change */
.wave-btn:hover {
  background: #34495e;
}

.back {
  background: #7f8c8d;
}

.back:hover {
  background: #95a5a6;
}

/* Seesaw wave animation */
@keyframes waveOscillate {
  0%   { d: path("M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"); }
  50%  { d: path("M0,10 C30,0 60,30 120,10 L120,40 L0,40 Z"); }
  100% { d: path("M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"); }
}
</style>
</head>
<body>

<h2>📦 Product Management</h2>

<div class="menu">
  <a href="scanner.html" class="wave-btn">
    <span>📷 Product Scanner</span>
    <svg viewBox="0 0 120 40" preserveAspectRatio="none">
      <path d="M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"></path>
    </svg>
  </a>

  <a href="products.html" class="wave-btn">
    <span>📦 View All Products</span>
    <svg viewBox="0 0 120 40" preserveAspectRatio="none">
      <path d="M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"></path>
    </svg>
  </a>

  <a href="monitoring.html" class="wave-btn">
    <span>📝 Monitoring Log</span>
    <svg viewBox="0 0 120 40" preserveAspectRatio="none">
      <path d="M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"></path>
    </svg>
  </a>

  <a href="index.html" class="wave-btn back">
    <span>⬅️ Back to Dashboard</span>
    <svg viewBox="0 0 120 40" preserveAspectRatio="none">
      <path d="M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"></path>
    </svg>
  </a>
</div>

</body>
</html>
