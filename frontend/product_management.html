<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product Management</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f6fa;
  margin: 0;
  padding: 20px;
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

.menu {
  max-width: 400px;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* Button wrapper */
.wave-btn {
  position: relative;
  display: block;
  padding: 18px;
  text-align: center;
  font-size: 18px;
  color: white;
  background: #2c3e50;
  border-radius: 8px;
  overflow: hidden;
  text-decoration: none;
  cursor: pointer;
}

/* Wave overlay */
.wave-btn svg {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 40px;
  fill: #3498db; /* default blue wave */
}

/* Animated seesaw wave */
.wave-btn svg path {
  animation: waveOscillate 2s ease-in-out infinite alternate;
}

/* Keep text above wave */
.wave-btn span {
  position: relative;
  z-index: 1;
}

/* Hover color change */
.wave-btn:hover {
  background: #34495e;
}

/* Dashboard button special: light blue wave + ripple */
.dashboard {
  background: #5dade2;
}

.dashboard svg path {
  fill: #85c1e9; /* light blue wave */
}

.dashboard:active::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  width: 100px;
  height: 100px;
  top: 50%;
  left: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.6), rgba(0,150,255,0));
  transform: translate(-50%, -50%) scale(0);
  animation: ripple 0.6s forwards;
  pointer-events: none;
  z-index: 2;
}

/* Seesaw wave animation */
@keyframes waveOscillate {
  0%   { d: path("M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"); }
  50%  { d: path("M0,10 C30,0 60,30 120,10 L120,40 L0,40 Z"); }
  100% { d: path("M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"); }
}

/* Ripple effect */
@keyframes ripple {
  to {
    transform: translate(-50%, -50%) scale(3);
    opacity: 0;
  }
}
</style>
</head>
<body>

<h2>📦 Product Management</h2>

<div class="menu">
  <a href="scanner.html" class="wave-btn">
    <span>📷 Product Scanner</span>
    <svg viewBox="0 0 120 40" preserveAspectRatio="none">
      <path d="M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"></path>
    </svg>
  </a>

  <a href="products.html" class="wave-btn">
    <span>📦 View All Products</span>
    <svg viewBox="0 0 120 40" preserveAspectRatio="none">
      <path d="M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"></path>
    </svg>
  </a>

  <a href="monitoring.html" class="wave-btn">
    <span>📝 Monitoring Log</span>
    <svg viewBox="0 0 120 40" preserveAspectRatio="none">
      <path d="M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"></path>
    </svg>
  </a>

  <!-- Dashboard Button with Light Blue Wave + Ripple -->
  <a href="index.html" class="wave-btn dashboard">
    <span>⬅️ Back to Dashboard</span>
    <svg viewBox="0 0 120 40" preserveAspectRatio="none">
      <path d="M0,20 C30,30 60,10 120,20 L120,40 L0,40 Z"></path>
    </svg>
  </a>
</div>

</body>
</html>
