<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>
  <link rel="icon" href="/static/img/cael.ico" type="image/x-icon">
  <script src="https://unpkg.com/vue@3"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      color: #00eaff;
    }

    /* ---------- NEON CARD ---------- */
    .box {
      width: 100%;
      max-width: 400px;
      background: #0b0b14;
      padding: 36px 28px;
      border-radius: 12px;
      text-align: center;
      animation: flicker 3.5s infinite alternate;
    }

    @keyframes flicker {
      0% {
        box-shadow: 0 0 10px #00eaff;
      }
      50% {
        box-shadow: 0 0 18px #00eaff;
      }
      100% {
        box-shadow: 0 0 26px #00eaff;
      }
    }

    .logo {
      width: 70px;
      margin-bottom: 18px;
    }

    h2 {
      margin-bottom: 18px;
      font-weight: 500;
      color: #00eaff;
    }

    /* ---------- INPUTS ---------- */
    input {
      width: 100%;
      padding: 11px;
      margin: 7px 0;
      border-radius: 6px;
      border: none;
      outline: none;
      background: #111;
      color: #00eaff;
      font-size: 14px;
    }

    input::placeholder {
      color: #00b3cc;
    }

    /* ---------- BUTTON ---------- */
    button {
      width: 100%;
      padding: 11px;
      margin-top: 12px;
      border-radius: 6px;
      border: none;
      background: #00eaff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 12px #00eaff;
      transition: 0.2s;
    }

    button:hover {
      box-shadow: 0 0 20px #00eaff;
    }

    button:disabled {
      background: #333;
      color: #777;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* ---------- TEXT ---------- */
    .error {
      color: #ff4444;
      font-size: 13px;
      text-align: left;
      margin-top: -4px;
    }

    .ok {
      color: #44ffcc;
      font-size: 13px;
      text-align: left;
      margin-top: -4px;
    }

    p {
      font-size: 14px;
      margin-top: 14px;
    }

    a {
      color: #00eaff;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 420px) {
      .box {
        margin: 16px;
      }
    }
  </style>
</head>
<body>

<div id="app" class="box">
  <img src="/static/img/cael.ico" class="logo" alt="Logo">

  <!-- USERNAME -->
  <input
    v-model="f.username"
    @input="onUsernameInput"
    @blur="checkUsername"
    placeholder="Username"
  >
  <div v-if="usernameError" class="error">{{ usernameError }}</div>
  <div v-if="usernameOk" class="ok">✔ Username available</div>

  <!-- EMAIL -->
  <input
    v-model="f.useremail"
    @input="onEmailInput"
    @blur="checkEmail"
    placeholder="Email"
  >
  <div v-if="emailError" class="error">{{ emailError }}</div>
  <div v-if="emailOk" class="ok">✔ Email available</div>

  <!-- PASSWORD -->
  <input type="password" v-model="f.password" placeholder="Password">

  <!-- NAME -->
  <input v-model="f.firstname" placeholder="First name">
  <input v-model="f.middlename" placeholder="Middle name (optional)">
  <input v-model="f.lastname" placeholder="Last name">

  <!-- STORE -->
  <input v-model="f.address" placeholder="Address">
  <input v-model="f.storename" placeholder="Store name">
  <input v-model="f.storelocation" placeholder="Store location">

  <button @click="register" :disabled="loading || !canSubmit">
    {{ loading ? "Registering..." : "Register" }}
  </button>

  <p>{{ message }}</p>

  <p>
    Already have an account?
    <a href="login.html">Login</a>
  </p>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      f: {
        username:"",
        useremail:"",
        password:"",
        firstname:"",
        middlename:"",
        lastname:"",
        address:"",
        storename:"",
        storelocation:""
      },
      loading:false,
      message:"",
      usernameError:"",
      emailError:"",
      usernameOk:false,
      emailOk:false
    }
  },

  computed:{
    canSubmit() {
      return (
        this.usernameOk &&
        this.emailOk &&
        this.f.password &&
        this.f.firstname &&
        this.f.lastname
      );
    }
  },

  methods:{
    onUsernameInput() {
      this.usernameOk = false;
      this.usernameError = "";
    },
    onEmailInput() {
      this.emailOk = false;
      this.emailError = "";
    },

    async checkUsername() {
      if (!this.f.username) return;
      const r = await fetch(`${API}/check-availability?username=${encodeURIComponent(this.f.username)}`);
      const d = await r.json();
      this.usernameOk = d.available;
      this.usernameError = d.available ? "" : "❌ Username already taken";
    },

    async checkEmail() {
      if (!this.f.useremail) return;
      const r = await fetch(`${API}/check-availability?email=${encodeURIComponent(this.f.useremail)}`);
      const d = await r.json();
      this.emailOk = d.available;
      this.emailError = d.available ? "" : "❌ Email already registered";
    },

    async register() {
      this.message = "";
      this.loading = true;

      try {
        const r = await fetch(`${API}/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(this.f)
        });

        const d = await r.json();
        if (!r.ok) {
          this.message = d.detail || "Registration failed";
          return;
        }

        window.location.href = `verify.html?email=${encodeURIComponent(d.email)}`;
      } catch {
        this.message = "Server not responding";
      } finally {
        this.loading = false;
      }
    }
  }
}).mount("#app");
</script>

</body>
</html>
