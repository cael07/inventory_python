<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoring Log</title>
  <script src="https://unpkg.com/vue@3"></script>
  <style>
    table { width:100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border:1px solid #ccc; padding:6px; font-size:14px; text-align:center; }
    .loader { text-align:center; padding:10px; font-weight:bold; }
  </style>
</head>
<body>

<a href="product_management.html">⬅️ Back</a>
<h2>📝 Monitoring Log</h2>

<div id="app">
  <table v-if="rows.length > 0">
    <tr>
      <th>#</th>
      <th>Date</th>
      <th>Barcode</th>
      <th>Name</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Total</th>
      <th>Remark</th>
    </tr>
    <tr v-for="(m, i) in rows" :key="m.id">
      <td>{{ i + 1 }}</td>
      <td>{{ formatDate(m.date) }}</td>
      <td>{{ m.barcode }}</td>
      <td>{{ m.name }}</td>
      <td>₱{{ m.price }}</td>
      <td>{{ m.quantity }}</td>
      <td>₱{{ m.total_price }}</td>
      <td>{{ m.remark }}</td>
    </tr>
  </table>

  <div class="loader" v-if="loading">Loading...</div>
  <div class="loader" v-if="!loading && rows.length && !canLoadMore">End of log</div>
  <div class="loader" v-if="!loading && rows.length === 0">No records found</div>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      rows: [],
      page: 1,
      limit: 20,
      total: 0,
      loading: false
    }
  },

  computed: {
    canLoadMore() {
      return this.rows.length < this.total;
    }
  },

  methods: {
    async loadMore() {
      if (this.loading || (this.total && !this.canLoadMore)) return;
      this.loading = true;

      try {
        const res = await fetch(`${API}/monitoring?page=${this.page}&limit=${this.limit}`);
        const data = await res.json();

        if (data.items && data.items.length > 0) {
          this.rows.push(...data.items); // append new items
        }

        this.total = data.total_records;
        this.page++;
      } catch (err) {
        console.error("Error loading monitoring log:", err);
      } finally {
        this.loading = false;
      }
    },

    handleScroll() {
      if (
        window.innerHeight + window.scrollY >=
        document.body.offsetHeight - 50
      ) {
        this.loadMore();
      }
    },

    formatDate(dt) {
      // simple format YYYY-MM-DD HH:MM:SS
      if (!dt) return "";
      return dt.replace("T", " ").split(".")[0];
    }
  },

  mounted() {
    this.loadMore(); // initial load
    window.addEventListener("scroll", this.handleScroll);
  },

  unmounted() {
    window.removeEventListener("scroll", this.handleScroll);
  }
}).mount("#app");
</script>

</body>
</html>
