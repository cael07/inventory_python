<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoring Log</title>
  <script src="https://unpkg.com/vue@3"></script>
  <style>
    table { width:100%; border-collapse: collapse; }
    th, td { border:1px solid #ccc; padding:6px; font-size:14px; }
    .loader { text-align:center; padding:10px; }
  </style>
</head>
<body>

<a href="product_management.html">⬅️ Back</a>
<h2>📝 Monitoring Log</h2>

<div id="app">
  <table v-if="rows.length">
    <tr>
      <th>#</th>
      <th>Date</th>
      <th>Barcode</th>
      <th>Name</th>
      <th>Price</th>
      <th>Qty</th>
      <th>Total</th>
      <th>Remark</th>
    </tr>

    <tr v-for="(m, i) in rows" :key="m.id">
      <td>{{ i + 1 }}</td>
      <td>{{ m.date }}</td>
      <td>{{ m.barcode }}</td>
      <td>{{ m.name }}</td>
      <td>₱{{ m.price }}</td>
      <td>{{ m.quantity }}</td>
      <td>₱{{ m.total_price }}</td>
      <td>{{ m.remark }}</td>
    </tr>
  </table>

  <div class="loader" v-if="loading">Loading...</div>
  <div class="loader" v-if="!canLoadMore">End of log</div>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      rows: [],
      page: 1,
      limit: 20,
      total: 0,
      loading: false
    }
  },

  computed: {
    canLoadMore() {
      return this.rows.length < this.total;
    }
  },

  methods: {
    async loadMore() {
      if (this.loading || !this.canLoadMore) return;
      this.loading = true;

      const res = await fetch(
        `${API}/monitoring?page=${this.page}&limit=${this.limit}`
      );
      const data = await res.json();

      this.rows.push(...data.items);
      this.total = data.total_records;
      this.page++;

      this.loading = false;
    },

    handleScroll() {
      if (
        window.innerHeight + window.scrollY >=
        document.body.offsetHeight - 50
      ) {
        this.loadMore();
      }
    }
  },

  mounted() {
    this.loadMore();
    window.addEventListener("scroll", this.handleScroll);
  }
}).mount("#app");
</script>

</body>
</html>
