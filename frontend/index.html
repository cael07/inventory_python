<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>

  <!-- 🔷 Reusable Top Bar -->
  <link rel="stylesheet" href="/static/css/topbar.css">
  <script src="/static/js/topbar.js" defer></script>

  <style>
    /* Reset body padding/margin for topbar */
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f6fa;
    }

    /* Page content wrapper */
    .page {
      padding: 20px; /* only page content has padding */
      max-width: 800px;
      margin: 0 auto;
    }

    /* Dashboard menu links */
    .menu-link {
      display: block;
      margin: 10px 0;
      text-decoration: none;
      color: white;
      background: #333;
      padding: 12px 16px;
      border-radius: 6px;
      width: 200px;
      text-align: center;
      transition: background 0.2s, transform 0.2s;
    }

    .menu-link:hover {
      background: #555;
      transform: translateY(-2px);
    }

    /* Optional: topbar hamburger button */
    .topbar-hamburger {
      width: 32px;
      height: 32px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      cursor: pointer;
    }

    .topbar-hamburger span {
      display: block;
      height: 3px;
      background: white;
      border-radius: 2px;
    }
  </style>
</head>
<body>

<!-- Topbar is injected by topbar.js -->

<div class="page">
  <h2>📊 Dashboard</h2>

  <!-- Menu links -->
  <a href="scanner.html" class="menu-link">📷 Scanner</a>
  <a href="products.html" class="menu-link">📦 All Products</a>
  <a href="monitoring.html" class="menu-link">📝 Monitoring</a>
  <a href="product_management.html" class="menu-link">⚙️ Product Management</a>
</div>

</body>
</html>
