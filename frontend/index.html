<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>

  <!-- 🔷 Reusable Top Bar -->
  <link rel="stylesheet" href="/static/css/topbar.css">
  <script src="/static/js/topbar.js" defer></script>

  <!-- 📊 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f6fa;
    }

    .page {
      padding: 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    h3 {
      margin-top: 30px;
    }

    canvas {
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    .chart-box {
      display: none;
      margin-top: 20px;
    }

    .chart-box.active {
      display: block;
    }

    .filters {
      margin: 20px 0;
    }

    .filters label {
      margin-right: 20px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- Topbar injected by topbar.js -->

<div class="page">

  <!-- 📅 PURCHASE FILTER -->
  <div class="filters">
    <label>
      <input type="radio" name="chartType" value="daily" checked>
      Daily
    </label>
    <label>
      <input type="radio" name="chartType" value="monthly">
      Monthly
    </label>
  </div>

  <!-- 📊 DAILY -->
  <div id="dailyBox" class="chart-box active">
    <h3>📊 Daily Purchases</h3>
    <canvas id="dailyChart" height="120"></canvas>
  </div>

  <!-- 📈 MONTHLY -->
  <div id="monthlyBox" class="chart-box">
    <h3>📈 Monthly Purchases</h3>
    <canvas id="monthlyChart" height="120"></canvas>
  </div>

  <!-- 🏆 TOP PRODUCTS -->
  <h3>🏆 Top 10 Product Sales</h3>

  <div class="filters">
    <label>
      <input type="radio" name="topType" value="daily" checked>
      Daily
    </label>
    <label>
      <input type="radio" name="topType" value="monthly">
      Monthly
    </label>
  </div>

  <canvas id="topProductChart" height="180"></canvas>

</div>

<script>
const API = "https://inventory-python.onrender.com";

let dailyChart, monthlyChart, topChart;

/* ---------------- DAILY LINE ---------------- */
async function loadDailyChart() {
  const res = await fetch(`${API}/stats/purchases/daily`);
  const data = await res.json();

  dailyChart = new Chart(dailyChart ?? document.getElementById("dailyChart"), {
    type: "line",
    data: {
      labels: data.map(d => d.date),
      datasets: [{
        label: "Daily Purchase Total (₱)",
        data: data.map(d => d.total),
        tension: 0.35,
        fill: true,
        pointRadius: 5
      }]
    },
    options: {
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
}

/* ---------------- MONTHLY LINE ---------------- */
async function loadMonthlyChart() {
  const res = await fetch(`${API}/stats/purchases/monthly`);
  const data = await res.json();

  monthlyChart = new Chart(monthlyChart ?? document.getElementById("monthlyChart"), {
    type: "line",
    data: {
      labels: data.map(d => d.month),
      datasets: [{
        label: "Monthly Purchase Total (₱)",
        data: data.map(d => d.total),
        tension: 0.35,
        fill: true,
        pointRadius: 5
      }]
    },
    options: {
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
}

/* ---------------- TOP PRODUCTS ---------------- */
async function loadTopProducts(type = "daily") {
  const res = await fetch(`${API}/stats/products/top/${type}`);
  const data = await res.json();

  if (topChart) topChart.destroy();

  topChart = new Chart(document.getElementById("topProductChart"), {
    type: "bar",
    data: {
      labels: data.map(d => d.name),
      datasets: [{
        label: "Total Quantity Sold",
        data: data.map(d => d.quantity)
      }]
    },
    options: {
      indexAxis: "y",
      scales: {
        x: { beginAtZero: true }
      }
    }
  });
}

/* ---------------- TOGGLES ---------------- */
document.querySelectorAll('input[name="chartType"]').forEach(r => {
  r.addEventListener("change", e => {
    dailyBox.classList.remove("active");
    monthlyBox.classList.remove("active");
    document.getElementById(e.target.value + "Box").classList.add("active");
  });
});

document.querySelectorAll('input[name="topType"]').forEach(r => {
  r.addEventListener("change", e => loadTopProducts(e.target.value));
});

/* ---------------- LOAD ---------------- */
loadDailyChart();
loadMonthlyChart();
loadTopProducts("daily");
</script>

</body>
</html>
