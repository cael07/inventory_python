<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/vue@3"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    video {
      width: 100%;
      max-width: 400px;
      border: 2px solid #333;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #fff;
      padding: 20px;
      width: 300px;
      border-radius: 6px;
    }

    input {
      width: 100%;
      margin-bottom: 10px;
      padding: 6px;
    }

    button {
      margin-right: 5px;
    }

    ul { margin-top: 20px; }
  </style>
</head>
<body>

<div id="app">
  <button @click="startScan">📷 Scan Barcode</button>
  <button @click="loadProducts">📦 Show All Products</button>
  <p>Status: {{ status }}</p>

  <video id="video"></video>

<!-- MODAL -->
<div v-if="showModal" class="modal">
  <div class="modal-box">
    <h3>Product {{ existing ? 'Found (Editable)' : 'New' }}</h3>

<input v-model="form.barcode" readonly />
<input v-model="form.name" placeholder="Product name" />
<input v-model="form.price" type="number" placeholder="Price" />
<input v-model="form.quantity" type="number" placeholder="Quantity" />


    <button @click="save">Save</button>
    <button @click="cancel">Close</button>
  </div>
</div>

  <!-- Product list -->
<ul>
  <li v-for="p in products" :key="p.id">
    {{ p.barcode }} — {{ p.name }} — ₱{{ p.price }} — Qty: {{ p.quantity }}
  </li>
</ul>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      status: "idle",
      showModal: false,
      existing: false,
      reader: null,
      form: { barcode: "", name: "", price: "" },
      products: []
    }
  },
  methods: {
    startScan() {
      this.status = "starting camera";
      this.reader = new ZXing.BrowserMultiFormatReader();

      this.reader.decodeFromVideoDevice(null, "video", (result, err) => {
        if (result) {
          this.reader.reset();
          this.form.barcode = result.text;
          this.status = "barcode detected";

          // Fetch product by barcode
          fetch(`${API}/product/${result.text}`)
            .then(r => r.json())
            .then(data => {
              if (data && data.id) {
                this.existing = true;
                this.form.name = data.name;
                this.form.price = data.price;
              } else {
                this.existing = false;
                this.form.name = "";
                this.form.price = "";
              }
              this.showModal = true;
            })
            .catch(() => {
              this.existing = false;
              this.form.name = "";
              this.form.price = "";
              this.showModal = true;
            });
        }
      });
    },

    save() {
  const url = this.existing
    ? `${API}/product/${this.form.barcode}`   // update existing
    : `${API}/product`;                       // create new

  const method = this.existing ? "PUT" : "POST";

  fetch(url, {
    method: method,
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      barcode: this.form.barcode,
      name: this.form.name,
      price: Number(this.form.price),
      quantity: Number(this.form.quantity)
    })
  })
  .then(() => {
    alert(this.existing ? "Updated" : "Saved");
    this.resetForm();
    this.loadProducts(); // refresh list
  });
},

    cancel() {
      this.resetForm();
    },

    resetForm() {
      this.showModal = false;
      this.existing = false;
      this.form = { barcode: "", name: "", price: "" };
      this.status = "idle";
    },

    loadProducts() {
      fetch(`${API}/products`)
        .then(r => r.json())
        .then(data => { this.products = data; });
    }
  }
}).mount("#app");
</script>

</body>
</html>
