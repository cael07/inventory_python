<div id="app">
  <button @click="startScan('add')">📷 Scan to Add</button>
  <button @click="startScan('search')">🔍 Scan to Search</button>
  <button @click="loadProducts">📦 Show All Products</button>

  <p>Status: {{ status }}</p>

  <video id="video"></video>

  <!-- Modal for adding new product -->
  <div v-if="showModal" class="modal">
    <div class="modal-box">
      <h3>New Product</h3>

      <input v-model="form.barcode" readonly />
      <input v-model="form.name" placeholder="Product name" />
      <input v-model="form.price" type="number" placeholder="Price" />

      <button @click="save">Save</button>
      <button @click="cancel">Cancel</button>
    </div>
  </div>

  <!-- List of products (for search / show all) -->
  <ul>
    <li v-for="p in products" :key="p.id">
      {{ p.barcode }} — {{ p.name }} — ₱{{ p.price }}
    </li>
  </ul>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      status: "idle",
      showModal: false,
      reader: null,
      products: [],
      scanMode: null, // 'add' or 'search'
      form: { barcode: "", name: "", price: "" }
    }
  },
  methods: {
    startScan(mode) {
      this.scanMode = mode;
      this.status = "starting camera";

      this.reader = new ZXing.BrowserMultiFormatReader();
      this.reader.decodeFromVideoDevice(null, "video", (result, err) => {
        if (result) {
          this.form.barcode = result.text;
          this.reader.reset();

          if (this.scanMode === 'add') {
            this.showModal = true;
            this.status = "barcode detected (add)";
          } else if (this.scanMode === 'search') {
            this.status = "barcode detected (search)";
            this.fetchProduct(result.text);
          }
        }
      });
    },

    fetchProduct(barcode) {
      fetch(`${API}/product/${barcode}`)
        .then(r => r.json())
        .then(data => {
          if (data) {
            this.products = [data];
          } else {
            alert("Product not found");
            this.products = [];
          }
          this.status = "search complete";
        });
    },

    save() {
      fetch(`${API}/product`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          barcode: this.form.barcode,
          name: this.form.name,
          price: Number(this.form.price)
        })
      })
      .then(() => {
        alert("Saved");
        this.resetForm();
      });
    },

    cancel() {
      this.resetForm();
    },

    resetForm() {
      this.showModal = false;
      this.form = { barcode: "", name: "", price: "" };
      this.status = "idle";
    },

    loadProducts() {
      fetch(`${API}/products`)
        .then(r => r.json())
        .then(data => { this.products = data; });
    }
  }
}).mount("#app");
</script>
