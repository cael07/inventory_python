<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/vue@3"></script>
  <script src="https://unpkg.com/@zxing/library@latest"></script>

  <style>
    video {
      width: 100%;
      max-width: 400px;
      border: 2px solid #333;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-box {
      background: #fff;
      padding: 20px;
      width: 300px;
      border-radius: 6px;
    }

    input {
      width: 100%;
      margin-bottom: 10px;
      padding: 6px;
    }

    button {
      margin-right: 5px;
    }
  </style>
</head>
<body>

<div id="app">
  <button @click="startScan">📷 Scan Barcode</button>
  <p>Status: {{ status }}</p>

  <video id="video"></video>

  <!-- MODAL -->
  <div v-if="showModal" class="modal">
    <div class="modal-box">
      <h3>New Product</h3>

      <input v-model="form.barcode" readonly />
      <input v-model="form.name" placeholder="Product name" />
      <input v-model="form.price" type="number" placeholder="Price" />

      <button @click="save">Save</button>
      <button @click="cancel">Cancel</button>
    </div>
  </div>
</div>

<script>
const API = "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      status: "idle",
      showModal: false,
      reader: null,
      form: {
        barcode: "",
        name: "",
        price: ""
      }
    }
  },
  methods: {
    startScan() {
      this.status = "starting camera";
      this.reader = new ZXing.BrowserMultiFormatReader();

      this.reader.decodeFromVideoDevice(
        null,
        "video",
        (result, err) => {
          if (result) {
            this.form.barcode = result.text;
            this.showModal = true;
            this.status = "barcode detected";
            this.reader.reset();
          }
        }
      );
    },

    save() {
      fetch(`${API}/product`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          barcode: this.form.barcode,
          name: this.form.name,
          price: Number(this.form.price)
        })
      })
      .then(() => {
        alert("Saved");
        this.resetForm();
      });
    },

    cancel() {
      this.resetForm();
    },

    resetForm() {
      this.showModal = false;
      this.form = { barcode: "", name: "", price: "" };
      this.status = "idle";
    }
  }
}).mount("#app");
</script>

</body>
</html>
