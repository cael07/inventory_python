<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>

  <!-- 🔷 Reusable Top Bar -->
  <link rel="stylesheet" href="/static/css/topbar.css">
  <script src="/static/js/topbar.js" defer></script>

  <!-- 📊 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      background: #f5f6fa;
    }

    .page {
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    .menu-link {
      display: block;
      margin: 10px 0;
      text-decoration: none;
      color: white;
      background: #333;
      padding: 12px 16px;
      border-radius: 6px;
      width: 200px;
      text-align: center;
    }

    h3 {
      margin-top: 30px;
    }

    canvas {
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }

    /* 🔘 Radio buttons */
    .chart-filter {
      margin: 20px 0;
      background: white;
      padding: 12px;
      border-radius: 8px;
      display: inline-flex;
      gap: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .chart-box {
      display: none;
    }

    .chart-box.active {
      display: block;
    }
  </style>
</head>
<body>

<div class="page">
  <h2>📊 Dashboard</h2>

  <!-- Menu -->
  <a href="scanner.html" class="menu-link">📷 Scanner</a>
  <a href="products.html" class="menu-link">📦 All Products</a>
  <a href="monitoring.html" class="menu-link">📝 Monitoring</a>
  <a href="product_management.html" class="menu-link">⚙️ Product Management</a>

  <!-- 🔘 Chart Filter -->
  <div class="chart-filter">
    <label>
      <input type="radio" name="chartType" value="daily" checked>
      Daily
    </label>
    <label>
      <input type="radio" name="chartType" value="monthly">
      Monthly
    </label>
  </div>

  <!-- 📊 DAILY -->
  <div id="dailyBox" class="chart-box active">
    <h3>📊 Daily Purchases</h3>
    <canvas id="dailyChart" height="120"></canvas>
  </div>

  <!-- 📈 MONTHLY -->
  <div id="monthlyBox" class="chart-box">
    <h3>📈 Monthly Purchases</h3>
    <canvas id="monthlyChart" height="120"></canvas>
  </div>
</div>

<script>
const API = "https://inventory-python.onrender.com";

let dailyChart, monthlyChart;

// 🔁 Toggle charts
document.querySelectorAll("input[name='chartType']").forEach(radio => {
  radio.addEventListener("change", e => {
    document.getElementById("dailyBox").classList.remove("active");
    document.getElementById("monthlyBox").classList.remove("active");

    if (e.target.value === "daily") {
      document.getElementById("dailyBox").classList.add("active");
    } else {
      document.getElementById("monthlyBox").classList.add("active");
    }
  });
});

// 📊 Daily chart
async function loadDailyChart() {
  const res = await fetch(`${API}/stats/purchases/daily`);
  const data = await res.json();

  dailyChart = new Chart(document.getElementById("dailyChart"), {
    type: "line",
    data: {
      labels: data.map(d => d.date),
      datasets: [{
        label: "Daily Purchase Total (₱)",
        data: data.map(d => d.total),
        tension: 0.3,
        fill: true
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
}

// 📈 Monthly chart
async function loadMonthlyChart() {
  const res = await fetch(`${API}/stats/purchases/monthly`);
  const data = await res.json();

  monthlyChart = new Chart(document.getElementById("monthlyChart"), {
    type: "bar",
    data: {
      labels: data.map(d => d.month),
      datasets: [{
        label: "Monthly Purchase Total (₱)",
        data: data.map(d => d.total)
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: { beginAtZero: true }
      }
    }
  });
}

// Load once
loadDailyChart();
loadMonthlyChart();
</script>

</body>
</html>
