<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link rel="icon" href="/static/img/cael.ico" type="image/x-icon">
  <!-- 🔷 Reusable Top Bar -->
  <link rel="stylesheet" href="/static/css/topbar.css">
  <script src="/static/js/topbar.js" defer></script>

  <!-- 📊 Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: sans-serif; margin:0; padding:0; background:#f5f6fa; }
    .page { padding:20px; max-width:900px; margin:0 auto; }
    h3 { margin-top:30px; }
    canvas { background:white; padding:10px; border-radius:8px; box-shadow:0 4px 8px rgba(0,0,0,0.15);}
    .filters { margin:20px 0; }
    .filters label { margin-right:20px; font-weight:bold; cursor:pointer; }
    .alert-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
    .alert-btn { color:white; padding:10px 16px; border-radius:6px; border:none; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:10px; flex: 1; min-width: 120px; justify-content: center; }
    .alert-orange { background:#f39c12; }
    .alert-red { background:#e74c3c; }
    .alert-blue { background:#0084ff; }
    .alert-gray { background:#8e8e93; }
    .alert-badge { background:white; color:#333; font-size:12px; font-weight:bold; padding:2px 8px; border-radius:12px; min-width:18px; text-align:center; }
    .alert-badge.pulse { animation:pulse 1.5s infinite; color:#e74c3c; }
    @keyframes pulse { 0%{transform:scale(1);opacity:1;}50%{transform:scale(1.15);opacity:0.8;}100%{transform:scale(1);opacity:1;} }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:1000; opacity:0; pointer-events:none; transition:opacity 0.3s ease; }
    .modal-overlay.show { opacity:1; pointer-events:all; }
    .modal { background:white; padding:20px; border-radius:10px; width:90%; max-width:400px; transform:scale(0.8); opacity:0; transition:transform 0.3s ease, opacity 0.3s ease; }
    .modal-overlay.show .modal { transform:scale(1); opacity:1; }
    .modal ul { padding-left:18px; }
    .modal li { margin-bottom:6px; }
    .close-btn { margin-top:15px; padding:8px 14px; background:#333; color:white; border:none; border-radius:5px; cursor:pointer; }
  </style>
</head>
<body>

<div class="page">
  <div class="alert-container">
    <button id="alertBtn" class="alert-btn alert-gray" style="display:none;">
      Stock <span id="alertBadge" class="alert-badge pulse">0</span>
    </button>

    <button id="sukiNotifyBtn" class="alert-btn alert-blue" style="background:#4b6584;" onclick="document.getElementById('nav-suki').click()">
      Suki <span id="sukiBadge" class="alert-badge">0</span>
    </button>

    <button id="msgNotifyBtn" class="alert-btn alert-blue" onclick="window.location.href='messages.html'">
      Message <span id="msgBadge" class="alert-badge">0</span>
    </button>
  </div>

  <!-- 📅 PURCHASE FILTER -->
  <div class="filters" id="chartFilters">
    <label><input type="radio" name="chartType" value="daily" checked> Daily</label>
    <label><input type="radio" name="chartType" value="monthly"> Monthly</label>
    <label><input type="radio" name="chartType" value="yearly"> Yearly</label>
  </div>

  <!-- 📊 SINGLE CHART -->
  <div>
    <h3>📊 Purchases</h3>
    <canvas id="purchaseChart" height="120"></canvas>
  </div>

  <!-- 🏆 TOP PRODUCTS -->
  <h3>🏆 Top 10 Product Sales</h3>
  <div class="filters">
    <label><input type="radio" name="topType" value="daily" checked> Daily</label>
    <label><input type="radio" name="topType" value="monthly"> Monthly</label>
  </div>
  <canvas id="topProductChart" height="180"></canvas>

</div>

<!-- 🪟 MODAL -->
<div id="modalOverlay" class="modal-overlay">
  <div class="modal">
    <h3>⚠️ Low Stock Products</h3>
    <ul id="lowStockList"></ul>
    <button class="close-btn" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
const API = window.CONFIG_API || "https://inventory-python.onrender.com";
let purchaseChart, topChart;
let lowStockProducts = [];

/* ---------------- LOW STOCK ---------------- */
async function checkLowStock() {
  const res = await fetch(`${API}/products?page=1&limit=1000`);
  const data = await res.json();
  lowStockProducts = data.items.filter(p => p.quantity < 5);
  
  const btn = document.getElementById("alertBtn");
  const badge = document.getElementById("alertBadge");

  if (lowStockProducts.length > 0) {
    btn.classList.remove("alert-gray");
    btn.classList.add("alert-red");
    badge.textContent = lowStockProducts.length;
    btn.style.display = "flex";
  } else {
    btn.style.display = "none";
  }
}

function openModal() { document.getElementById("modalOverlay").classList.add("show"); }
function closeModal() { document.getElementById("modalOverlay").classList.remove("show"); }

document.getElementById("alertBtn").onclick = () => {
  const list = document.getElementById("lowStockList");
  list.innerHTML = "";
  lowStockProducts.forEach(p => {
    const li = document.createElement("li");
    li.textContent = `${p.name} — ${p.quantity} left`;
    list.appendChild(li);
  });
  openModal();
};

document.getElementById("modalOverlay").addEventListener("click", e => {
  if(e.target.id==="modalOverlay") closeModal();
});

/* ---------------- PURCHASE CHART ---------------- */
async function loadPurchaseChart(type="daily") {
  let endpoint = type;
  const res = await fetch(`${API}/stats/purchases/${endpoint}`);
  const data = await res.json();

  if (purchaseChart) purchaseChart.destroy();

  purchaseChart = new Chart(document.getElementById("purchaseChart"), {
    type: "line",
    data: {
      labels: data.map(d => d.date || d.month || d.year),
      datasets: [{
        label: type==="daily"?"Daily Purchase Total (₱)": type==="monthly"?"Monthly Purchase Total (₱)":"Yearly Purchase Total (₱)",
        data: data.map(d => d.total),
        fill: true,
        tension: 0.35,
        pointRadius: 5
      }]
    },
    options: { scales: { y: { beginAtZero: true } } }
  });
}

/* ---------------- TOP PRODUCTS ---------------- */
async function loadTopProducts(type="daily") {
  const res = await fetch(`${API}/stats/products/top/${type}`);
  const data = await res.json();

  if(topChart) topChart.destroy();

  topChart = new Chart(document.getElementById("topProductChart"), {
    type:"bar",
    data:{ labels:data.map(d=>d.name), datasets:[{ label:"Total Quantity Sold", data:data.map(d=>d.quantity) }] },
    options:{ indexAxis:"y", scales:{ x:{ beginAtZero:true } } }
  });
}

/* ---------------- NOTIFICATIONS (SUKI & MSG) ---------------- */
async function checkOtherNotifications() {
  const user = JSON.parse(localStorage.getItem("user") || "{}");
  if (!user.id) return;

  try {
    // Suki requests
    const sukiRes = await fetch(`${API}/suki/pending/${user.id}`);
    if (sukiRes.ok) {
      const sukiReqs = await sukiRes.json();
      const sBadge = document.getElementById("sukiBadge");
      const sBtn = document.getElementById("sukiNotifyBtn");
      sBadge.textContent = sukiReqs.length;
      sBtn.style.background = sukiReqs.length > 0 ? "#e74c3c" : "#4b6584";
    }

    // Unread messages
    const msgRes = await fetch(`${API}/messages/contacts/${user.id}`);
    if (msgRes.ok) {
      const contacts = await msgRes.json();
      const totalUnread = contacts.reduce((sum, c) => sum + (c.unread_count || 0), 0);
      const mBadge = document.getElementById("msgBadge");
      const mBtn = document.getElementById("msgNotifyBtn");
      mBadge.textContent = totalUnread;
      mBtn.style.background = totalUnread > 0 ? "#e74c3c" : "#0084ff";
    }
  } catch (e) {
    console.error("Dashboard poll error:", e);
  }
}

/* ---------------- TOGGLES ---------------- */
document.querySelectorAll('input[name="chartType"]').forEach(r=>{
  r.addEventListener("change", e=>{
    loadPurchaseChart(e.target.value);
  });
});

document.querySelectorAll('input[name="topType"]').forEach(r=>{
  r.addEventListener("change", e=>{
    loadTopProducts(e.target.value);
  });
});

/* ---------------- LOAD ---------------- */
checkLowStock();
checkOtherNotifications();
loadPurchaseChart();
loadTopProducts("daily");

// Polling for notifications
setInterval(checkOtherNotifications, 10000); // 10s
setInterval(checkLowStock, 60000);           // 1m
</script>

</body>
</html>
