<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product</title>
  
  <!-- 🔷 Reusable Top Bar -->
  <link rel="stylesheet" href="/static/css/topbar.css">
  <script src="/static/js/topbar.js" defer></script>

  <style>
    html, body { max-width: 100%; overflow-x: hidden; font-family: sans-serif; margin: 0; background: #f4f7f6; }
    .page { padding: 20px; padding-top: 10px; }
    
    /* 🌊 Wave Back Button */
    .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
    .wave-btn {
      position: relative;
      display: inline-block;
      padding: 6px 12px;
      background: #1f3a5f;
      color: white;
      font-size: 15px;
      border-radius: 6px;
      text-decoration: none;
      overflow: hidden;
      white-space: nowrap;
    }
    .wave-btn span { position: relative; z-index: 1; }
    .wave-btn svg { position: absolute; bottom: 0; left: 0; width: 100%; height: 18px; fill: #3498db; }
    .wave-btn svg path { animation: waveOscillate 2.2s ease-in-out infinite alternate; }
    @keyframes waveOscillate {
      0%   { d: path("M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"); }
      50%  { d: path("M0,8 C30,0 60,20 120,8 L120,40 L0,40 Z"); }
      100% { d: path("M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"); }
    }

    video { width: 100%; max-width: 400px; border: 2px solid #333; border-radius: 8px; margin-bottom: 15px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 2000; }
    .modal-box { background: #fff; padding: 20px; width: 90%; max-width: 400px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    input { width: 100%; margin-bottom: 12px; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
    button { 
      padding: 12px 20px; 
      font-size: 16px; 
      cursor: pointer; 
      border: none; 
      border-radius: 6px; 
      background: #1f3a5f; 
      color: white;
      transition: background 0.2s;
    }
    button:hover { background: #2c5a8f; }
    .btn-secondary { background: #7f8c8d; }
    ul { margin-top: 20px; padding: 0; list-style: none; }
  </style>
</head>
<div id="app" class="page">

  <!-- HEADER -->
  <div class="header">
    <a href="dashboard.html" class="wave-btn">
      <span>⬅️ Back</span>
      <svg viewBox="0 0 120 40" preserveAspectRatio="none">
        <path d="M0,14 C30,20 60,8 120,14 L120,40 L0,40 Z"></path>
      </svg>
    </a>
    <h2 style="margin:0; font-size: 20px; color: #1f3a5f;">➕ Add Product</h2>
  </div>
  <button @click="startScan">📷 Scan Barcode</button>
  <p>Status: {{ status }}</p>

  <video id="video"></video>

<!-- ADD / EDIT PRODUCT MODAL -->
<div v-if="showModal" class="modal">
  <div class="modal-box">
    <h3>Product {{ existing ? 'Found (Editable)' : 'New' }}</h3>

    <label>Barcode</label>
    <input v-model="form.barcode" readonly />

    <label>Product Name</label>
    <input v-model="form.name" placeholder="Product name" />

    <label>Price</label>
    <input v-model="form.price" type="number" placeholder="Price" />

    <label>Quantity</label>
    <input v-model="form.quantity" type="number" placeholder="Quantity" />

    <button @click="save">Save</button>
    <button @click="cancel">Close</button>
  </div>
</div>

<!-- UPDATE PRODUCT MODAL -->
<div v-if="showUpdateModal" class="modal">
  <div class="modal-box">
    <h3>Update Product (Monitor)</h3>

    <label>Barcode</label>
    <input v-model="updateForm.barcode" readonly />

    <label>Product Name</label>
    <input v-model="updateForm.name" readonly />

    <label>Price</label>
    <input v-model="updateForm.price" type="number" placeholder="Price" />

    <p style="margin: 8px 0; font-size: 14px; color: #3498db; font-weight: bold;">
      Current Stock: {{ updateForm.existing_quantity }}
    </p>

    <label>Quantity to Add</label>
    <input v-model.number="updateForm.quantity" type="number" placeholder="Add Quantity" />

    <p style="margin: 8px 0; font-size: 14px; color: #27ae60; font-weight: bold;" v-if="updateForm.quantity > 0">
      New Total Stock: {{ updateForm.existing_quantity + updateForm.quantity }}
    </p>

    <label>Remark</label>
    <input v-model="updateForm.remark" placeholder="Remark" />

    <button @click="updateProduct">Save</button>
    <button @click="cancelUpdate">Close</button>
  </div>
</div>

  <!-- Modals and video handle the scanning and addition -->
</div>

<script>
const API = window.CONFIG_API || "https://inventory-python.onrender.com";

Vue.createApp({
  data() {
    return {
      status: "idle",
      showModal: false,
      showUpdateModal: false,
      existing: false,
      reader: null,
      form: { barcode: "", name: "", price: "", quantity: 0 },
      updateForm: { barcode: "", name: "", price: 0, existing_quantity: 0, quantity: 0, remark: "" },
      products: [],
      monitoring: []
    }
  },
  methods: {
    startScan() {
      this.status = "starting camera";
      this.reader = new ZXing.BrowserMultiFormatReader();

      this.reader.decodeFromVideoDevice(null, "video", (result, err) => {
        if (result) {
          this.reader.reset();
          const barcode = result.text;
          this.status = "barcode detected";

          fetch(`${API}/product/${barcode}`)
            .then(r => r.json())
            .then(data => {
              if (data && data.barcode) {
                // Product exists → show update modal
                this.updateForm.barcode = data.barcode;
                this.updateForm.name = data.name;
                this.updateForm.price = data.price;
                this.updateForm.existing_quantity = data.quantity || 0;
                this.updateForm.quantity = 0;
                this.updateForm.remark = "";
                this.showUpdateModal = true;
              } else {
                // New product → show add modal
                this.form.barcode = barcode;
                this.form.name = "";
                this.form.price = 0;
                this.form.quantity = 0;
                this.existing = false;
                this.showModal = true;
              }
            })
            .catch(() => {
              // On error, treat as new product
              this.form.barcode = barcode;
              this.form.name = "";
              this.form.price = 0;
              this.form.quantity = 0;
              this.existing = false;
              this.showModal = true;
            });
        }
      });
    },

    async save() {
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      const fullName = `${user.firstname || ""} ${user.middlename || ""} ${user.lastname || ""}`.trim() || user.username;

      const payload = {
        barcode: this.form.barcode,
        name: this.form.name,
        price: Number(this.form.price),
        quantity: Number(this.form.quantity),
        remark: this.existing ? "Update" : "New",
        total_price: Number(this.form.price) * Number(this.form.quantity),
        store_name: user.storename,
        created_by: fullName
      };

      try {
        const res = await fetch(`${API}/update_product/${this.form.barcode}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Failed to save");

        this.showModal = false;
        this.loadProducts();
        this.loadMonitoring();
        alert(this.existing ? "Updated" : "Saved");
      } catch (err) {
        console.error(err);
        alert("Error saving");
      }
    },

    async updateProduct() {
      const user = JSON.parse(localStorage.getItem("user") || "{}");
      const fullName = `${user.firstname || ""} ${user.middlename || ""} ${user.lastname || ""}`.trim() || user.username;

      const payload = {
        barcode: this.updateForm.barcode,
        name: this.updateForm.name,
        price: Number(this.updateForm.price),
        quantity: Number(this.updateForm.quantity),
        remark: this.updateForm.remark,
        total_price: Number(this.updateForm.price) * Number(this.updateForm.quantity),
        store_name: user.storename,
        created_by: fullName
      };

      try {
        const res = await fetch(`${API}/update_product/${this.updateForm.barcode}`, {
          method: "PUT",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Failed to update");

        this.cancelUpdate();
        this.loadProducts();
        this.loadMonitoring();
        alert("Product updated and monitored");
      } catch (err) {
        console.error(err);
        alert("Error updating product");
      }
    },


    cancel() {
      this.showModal = false;
      this.existing = false;
      this.form = { barcode: "", name: "", price: "", quantity: 0 };
    },

    cancelUpdate() {
      this.showUpdateModal = false;
      this.updateForm = { barcode: "", name: "", price: 0, quantity: 0, remark: "" };
    },

    loadProducts() {
      fetch(`${API}/products`)
        .then(r => r.json())
        .then(data => { this.products = data; });
    },

    loadMonitoring() {
      fetch(`${API}/monitoring`)
        .then(r => r.json())
        .then(data => { this.monitoring = data; });
    }
  }
}).mount("#app");
</script>

</body>
</html>
